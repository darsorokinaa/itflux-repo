# Статическая осенняя промо-страница.
# Домен: hello.itflux-academy.ru
#
# 1) Сначала этот файл (только :80), затем:
#    sudo certbot --nginx -d hello.itflux-academy.ru
# 2) Certbot сам добавит listen 443 ssl и редирект HTTP → HTTPS.

server {
    listen 80;
    server_name hello.itflux-academy.ru;

    root /var/www/hello.itflux-academy.ru;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
