# Изолированный узел LiveKit. Не запускать на сервере Django (5.42.106.185).
# Секреты задаются только через LIVEKIT_KEYS на хосте, в этот файл их не класть.
# Образ закреплён: livekit/livekit-server:v1.13.9 (актуальный релиз на 11 октября 2026).
# Перед стартом deploy/livekit/install.sh подставляет __PUBLIC_IP__ и __TURN_DOMAIN__.
# Сырой файл без подстановки не стартовать: ICE-кандидат и TURN будут неверными.

port: 7880
bind_addresses:
  # HTTP слушает все интерфейсы, чтобы nginx на этом же хосте ходил на 127.0.0.1:7880.
  # Наружу 7880 закрывает firewall. Иначе UDP мог бы остаться только на localhost.
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  # Публичный IP задаётся явно. STUN Google из российских сетей не используем как способ узнать адрес.
  use_external_ip: false
  node_ip: __PUBLIC_IP__
turn:
  enabled: true
  domain: __TURN_DOMAIN__
  tls_port: 5349
  udp_port: 3478
  ttl_seconds: 300
  cert_file: /etc/livekit/turn.crt
  key_file: /etc/livekit/turn.key
logging:
  level: info
  json: true
room:
  auto_create: true
  empty_timeout: 300
  max_participants: 12
webhook:
  urls: []
