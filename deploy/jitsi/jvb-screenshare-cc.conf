# itflux: screenshare quality. Merge into /etc/jitsi/videobridge/jvb.conf inside `videobridge { ... }`.
# Requires `systemctl restart jitsi-videobridge2` (do in maintenance window).
cc {
    # Default 360 => on-stage screenshare/large video capped at 360p when BWE is tight.
    onstage-preferred-height-px = 1080
    onstage-preferred-framerate = 5
    # Allow the on-stage (screenshare) source to take bandwidth first.
    allow-oversend-onstage = true
    max-oversend-bitrate = 1 Mbps
    trust-bwe = true
}
