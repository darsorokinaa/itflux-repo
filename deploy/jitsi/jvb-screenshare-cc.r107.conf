# itflux r107: убрать агрессивный oversend — на слабых каналах он отнимал полосу у звука (потери → хрип/шипение).
# Merge into /etc/jitsi/videobridge/jvb.conf inside `videobridge { ... }`, then
# `systemctl restart jitsi-videobridge2` ONLY between lessons (рвёт текущие звонки).
cc {
    onstage-preferred-height-px = 1080
    onstage-preferred-framerate = 5
    allow-oversend-onstage = false
    trust-bwe = true
}
