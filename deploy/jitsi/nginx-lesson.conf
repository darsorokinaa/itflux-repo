# nginx для lesson.itflux-academy.ru (системный Jitsi, не Docker)
# Важно: использовать "listen 443 ssl http2;" (без отдельной директивы http2)

server {
    listen 80;
    server_name lesson.itflux-academy.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name lesson.itflux-academy.ru;

    ssl_certificate     /etc/letsencrypt/live/lesson.itflux-academy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lesson.itflux-academy.ru/privkey.pem;

    root /usr/share/jitsi-meet;
    index index.html;
    ssi on;

    location = /config.js {
        alias /etc/jitsi/meet/lesson.itflux-academy.ru-config.js;
    }
    location = /interface_config.js {
        alias /usr/share/jitsi-meet/interface_config.js;
    }
    location = /external_api.js {
        alias /usr/share/jitsi-meet/libs/external_api.min.js;
    }

    # Медиа между участниками (без этого нет видео/звука)
    location ~ ^/colibri-ws/default-id/(.*) {
        proxy_pass http://127.0.0.1:9090/colibri-ws/default-id/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60m;
        tcp_nodelay on;
    }

    location = /http-bind {
        proxy_pass http://127.0.0.1:5280/http-bind;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        tcp_nodelay on;
    }

    location = /xmpp-websocket {
        proxy_pass http://127.0.0.1:5280/xmpp-websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60m;
        proxy_buffering off;
        tcp_nodelay on;
    }

    location ~ ^/([^/?&:'"]+)$ {
        try_files $uri @root_path;
    }
    location @root_path {
        rewrite ^/(.*)$ / break;
    }
    location / {
        ssi on;
        try_files $uri $uri/ /index.html;
    }
}
