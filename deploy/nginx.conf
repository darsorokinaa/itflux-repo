upstream itflux_asgi {
    server 127.0.0.1:8002;
}

server {
    listen 80;
    server_name test.itflux.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name test.itflux.ru;

    ssl_certificate     /etc/letsencrypt/live/test.itflux.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.itflux.ru/privkey.pem;

    client_max_body_size 50M;

    # Hashed Vite bundles — safe long cache (filename changes on content change)
    location /assets/ {
        alias /opt/itfluxacademy/itflux/frontend/dist/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /img/ {
        alias /opt/itfluxacademy/itflux/frontend/dist/img/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # PWA: нельзя отдавать через SPA fallback (index.html) — иначе SW не регистрируется
    location = /sw.js {
        alias /opt/itfluxacademy/itflux/frontend/dist/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        access_log off;
    }

    location = /manifest.webmanifest {
        alias /opt/itfluxacademy/itflux/frontend/dist/manifest.webmanifest;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        access_log off;
    }

    # Build identity for client update checks
    location = /version.json {
        alias /opt/itfluxacademy/itflux/frontend/dist/version.json;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        access_log off;
    }

    location /static/assets/ {
        alias /opt/itfluxacademy/itflux/frontend/dist/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Never long-cache SPA shell / SW / version if they land under /static/
    location = /static/index.html {
        alias /opt/itfluxacademy/itflux/staticfiles/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        access_log off;
    }

    location = /static/sw.js {
        alias /opt/itfluxacademy/itflux/staticfiles/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        access_log off;
    }

    location = /static/version.json {
        alias /opt/itfluxacademy/itflux/staticfiles/version.json;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        access_log off;
    }

    location /static/ {
        alias /opt/itfluxacademy/itflux/staticfiles/;
        access_log off;
        # Non-hashed Django/admin assets — short cache, not immutable
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # Файлы досок — приватные, доступ проверяется в Django (media_serve).
    # Более длинный префикс матчится раньше общего /media/, поэтому эти
    # запросы должны идти в приложение, а не отдаваться nginx напрямую с диска.
    location /media/cabinet/boards/ {
        proxy_pass http://itflux_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /media/cabinet/boards_private/ {
        proxy_pass http://itflux_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # «Мои файлы» — приватные, доступ только через Django API.
    location /media/cabinet/my-files/ {
        proxy_pass http://itflux_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /media/ {
        alias /opt/itfluxacademy/itflux/media/;
    }

    location /api/ {
        proxy_pass http://itflux_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Dynamic API must not be cached by browsers/proxies
        add_header Cache-Control "no-store, private" always;
    }

    location /admin/ {
        proxy_pass http://itflux_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /lesson/ {
        proxy_pass http://itflux_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Security-Policy "frame-src 'self' https://lesson.itflux-academy.ru;" always;
    }

    # Страница встроенной видеоконференции кабинета (Jitsi IFrame API).
    location /cabinet/meetings/ {
        proxy_pass http://itflux_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://lesson.itflux-academy.ru; frame-src 'self' https://lesson.itflux-academy.ru; connect-src 'self' https://lesson.itflux-academy.ru wss://lesson.itflux-academy.ru; img-src 'self' data: blob: https://lesson.itflux-academy.ru; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;
        add_header Permissions-Policy "camera=(self \"https://lesson.itflux-academy.ru\"), microphone=(self \"https://lesson.itflux-academy.ru\"), display-capture=(self \"https://lesson.itflux-academy.ru\"), fullscreen=(self \"https://lesson.itflux-academy.ru\"), autoplay=(self \"https://lesson.itflux-academy.ru\")" always;
    }

    location /ws/ {
        proxy_pass http://itflux_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://itflux_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # SPA shell (index.html) — always revalidate with origin
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }
}

server {
    listen 80;
    server_name lk-test.itflux.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lk-test.itflux.ru;

    ssl_certificate     /etc/letsencrypt/live/lk-test.itflux.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lk-test.itflux.ru/privkey.pem;

    location ~ ^/(login|logout|register|admin|settings|api|media)(/|$) {
        proxy_pass         http://127.0.0.1:8003;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/admin/ {
        alias /opt/lk_itflux/Cabinet/staticfiles/admin/;
        expires 1y;
        access_log off;
    }

    location /static/rest_framework/ {
        alias /opt/lk_itflux/Cabinet/staticfiles/rest_framework/;
        expires 1y;
        access_log off;
    }

    location /static/ {
        alias /opt/lk_itflux/frontend/build/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root  /opt/lk_itflux/frontend/build;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
