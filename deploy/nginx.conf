upstream itflux_asgi {
    server 127.0.0.1:8002;
}

server {
    listen 80;
    server_name test.itflux.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name test.itflux.ru;

    ssl_certificate     /etc/letsencrypt/live/test.itflux.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.itflux.ru/privkey.pem;

    client_max_body_size 50M;

    location /assets/ {
        alias /opt/itflux/frontend/dist/assets/;
        access_log off;
        expires 30d;
    }

    location /img/ {
        alias /opt/itflux/frontend/dist/img/;
        access_log off;
        expires 30d;
    }

    location /static/assets/ {
        alias /opt/itflux/frontend/dist/assets/;
        access_log off;
        expires 30d;
    }

    location /static/ {
        alias /opt/itflux/Generator/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /opt/itflux/Generator/media/;
    }

    location /api/ {
        proxy_pass http://itflux_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://itflux_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /lesson/ {
        proxy_pass http://itflux_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Security-Policy "frame-src 'self' https://lesson.itflux.ru https://meet.jit.si;" always;
    }

    location /ws/ {
        proxy_pass http://itflux_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://itflux_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
}

server {
    listen 80;
    server_name lk-test.itflux.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lk-test.itflux.ru;

    ssl_certificate     /etc/letsencrypt/live/lk-test.itflux.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lk-test.itflux.ru/privkey.pem;

    location ~ ^/(login|logout|register|admin|settings|api|media)(/|$) {
        proxy_pass         http://127.0.0.1:8003;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/admin/ {
        alias /opt/lk_itflux/Cabinet/staticfiles/admin/;
        expires 1y;
        access_log off;
    }

    location /static/rest_framework/ {
        alias /opt/lk_itflux/Cabinet/staticfiles/rest_framework/;
        expires 1y;
        access_log off;
    }

    location /static/ {
        alias /opt/lk_itflux/frontend/build/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root  /opt/lk_itflux/frontend/build;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
