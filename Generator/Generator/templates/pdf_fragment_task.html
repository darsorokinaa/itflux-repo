<article class="task{% if item.is_long %} task--long{% endif %}{% if item.start_new_page %} break-before{% endif %}{% if item.subdivision == 'geom' %} task-geom{% endif %}{% if item.is_oge_inf_part_2 %} task--inf-p2{% endif %}{% if item.is_oge_inf_13 %} task--inf-13{% endif %}">
  <div class="task-content">
    <div class="task-number">{{ item.order }}</div>
    <div class="task-text">
      {% if item.text %}{{ item.text|safe }}{% else %}<p>&nbsp;</p>{% endif %}
    </div>
    {% if item.max_score_phrase %}<div class="task-points">{{ item.max_score_phrase }}</div>{% endif %}

    {% if item.file_url %}
    <div class="materials">
      <a class="materials-link" href="{{ item.file_url }}" target="_blank" rel="noopener">
        <span class="materials-link__name">{{ item.file_name|default:"Материалы к заданию" }}</span>
        <span class="materials-link__hint">Скачать материалы к заданию</span>
      </a>
    </div>
    {% endif %}

    <div class="answer">
      <span class="answer-label">Ответ:</span>
      <span class="answer-line"></span>
    </div>
  </div>
</article>
