{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{% block title %} {% endblock %}</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=1" sizes="64x64" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=1" />
    <link rel="apple-touch-icon" href="/favicon.png?v=1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    
    <style>
        body {
            background-image: url("{% static 'img/bg.png' %}");
            background-repeat: repeat;
            background-size: auto;
            background-attachment: fixed;
        }
        .header-brand-logo {
            height: 72px;
            width: auto;
            display: block;
            object-fit: contain;
        }
        .logo a {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
    </style>
    
    {% block links %} {% endblock %}
</head>

<body>

    <header>
        <div class="container">
            <div class="header-wrapper">
                <div class="logo">
                    <a href="/">
                        <img src="/favicon.png?v=1" alt="Цифровой поток" class="header-brand-logo" width="72" height="72" decoding="async" />
                        <span class="logo-text">Цифровой поток</span>
                    </a>
                </div>
                
            </div>
        </div>
    </header>

    <aside>
        <!-- боковое меню -->
    </aside>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        © 2026
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
        <script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    chtml: {
      scale: 1,
      mtextInheritFont: true,
      matchFontHeight: true
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

</body>

</html>
