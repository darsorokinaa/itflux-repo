      box-shadow: 0 2px 8px rgba(0,0,0,0.1); pointer-events: auto; font-family: sans-serif;
    }

  </style>
</head>
<body>
  <!-- Teacher: Add extra task button (must be before <script> so getElementById works) -->
  <button id="lesson-add-task-btn" class="lesson-ui-btn lesson-ui-btn--primary lesson-ui-fab" title="Добавить задание">＋</button>

  <!-- Add task modal -->
  <div id="lesson-add-task-modal" class="lesson-modal-overlay lesson-modal-overlay--centered lesson-modal-font">
    <div class="lesson-modal-card">
      <!-- Header -->
      <div class="lesson-modal-header">
        <h2 class="lesson-modal-title">Добавить задание</h2>
        <button id="lesson-add-task-modal-close" class="lesson-modal-close">✕</button>
      </div>
      <!-- Body: slots + bank -->
      <div class="lesson-modal-layout">
        <!-- Left: task number slots -->
        <div id="lesson-task-slots" class="lesson-modal-slots">
          <div class="lesson-slot-header">Задание №</div>
        </div>
        <!-- Right: subtopic filter + task cards -->
        <div class="lesson-modal-bank-wrap">
          <div id="lesson-subtopic-bar" class="lesson-modal-subtopic-bar">
            <span class="lesson-subtopic-label">Подтема:</span>
          </div>
          <div id="lesson-task-bank" class="lesson-modal-bank">
            <div class="lesson-modal-placeholder">← Выберите номер задания</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Teacher: модалка итогов; кнопка завершения теперь только в меню iframe -->
  <div id="lesson-student-ui">
    <button type="button" id="lesson-student-results-top-btn" class="lesson-ui-btn lesson-ui-btn--primary" style="display:none;">Результаты</button>
  </div>

  <div id="lesson-finish-modal" class="lesson-modal-overlay lesson-modal-font">
    <div class="lesson-modal-card lesson-modal-card--finish">
      <div class="lesson-modal-header">
        <h2 class="lesson-modal-title" style="font-size:1.12rem;color:#0f172a;">Итоги урока</h2>
        <button type="button" id="lesson-finish-modal-close" class="lesson-modal-close">✕</button>
      </div>
      <div id="lesson-finish-modal-body" style="padding:16px 20px;max-height:min(70vh,620px);overflow-y:auto;"></div>
      <div class="lesson-modal-actions">
        <button type="button" id="lesson-finish-download-pdf" class="lesson-ui-btn lesson-ui-btn--primary">Сохранить PDF</button>
        <button type="button" id="lesson-finish-close-session" class="lesson-ui-btn lesson-ui-btn--danger" style="margin-left:auto;">Закрыть урок для всех</button>
      </div>
    </div>
  </div>
  <div id="lesson-student-results-modal" class="lesson-modal-overlay lesson-modal-font">
    <div class="lesson-modal-card lesson-modal-card--finish">
      <div class="lesson-modal-header">
        <h2 class="lesson-modal-title" style="font-size:1.08rem;color:#0f172a;">Результаты ученика</h2>
        <button type="button" id="lesson-student-results-modal-close" class="lesson-modal-close">✕</button>
      </div>
      <div id="lesson-student-results-body"></div>
    </div>
  </div>
  <div id="lesson-status-toast" class="lesson-status-toast" role="status" aria-live="polite">
    <span id="lesson-status-toast-text"></span>
    <button type="button" id="lesson-status-toast-close" class="lesson-status-toast__close" aria-label="Закрыть">✕</button>
  </div>

  <div id="lesson-page-root">
    <div id="lesson-frame-wrapper">
      <div id="scale-wrapper">
        <iframe id="variant-frame" title="Вариант урока"></iframe>
        <div id="whiteboard-layer">
          <canvas id="whiteboard-canvas"></canvas>
          <input type="text" id="wb-text-input" class="wb-text-input-overlay" placeholder="Введите текст...">
        </div>
      </div>
      <div id="whiteboard-toolbar" class="wb-toolbar"></div>
    </div>
  </div>
  <div id="fallback" role="status" aria-live="polite"></div>

  <script>
    (function () {
      const qs = new URLSearchParams(window.location.search);
      const roleFromServer = "{{ lesson_type|default:''|escapejs }}";
      const role = String(qs.get("role") || roleFromServer || "").trim().toLowerCase();
      let isTeacher = role === "teacher" || role === "tutor";

      const roomId = "{{ room_id|default:''|escapejs }}";
      const participantName = "{{ participant_name|default:''|escapejs }}";
      const payloadRaw = "{{ lesson_payload_json|default:'{}'|escapejs }}";
      const levelFromServer = "{{ lesson_level|default:''|escapejs }}";
      const subjectFromServer = "{{ lesson_subject|default:''|escapejs }}";
      const variantIdFromServer = "{{ lesson_variant_id|default:''|escapejs }}";
      const variantUrlFromServer = "{{ lesson_variant_url|default:''|escapejs }}";

      const frame = document.getElementById("variant-frame");
      const fallback = document.getElementById("fallback");
      if (!frame || !fallback) return;

      let payload = {};
      try { payload = JSON.parse(payloadRaw); } catch (_) { payload = {}; }

      if (!isTeacher) {
        const jr = String(
          payload.lesson_type ||
            payload.lessonType ||
            payload.lesson_format ||
            payload.lessonFormat ||
            payload.role ||
            payload.type ||
            ""
        )
          .trim()
          .toLowerCase();
        if (
          jr === "teacher" ||
          jr === "tutor" ||
          jr === "учитель" ||
          jr.includes("teacher") ||
          jr.includes("tutor") ||
          jr.includes("учит")
        ) {
          isTeacher = true;
        }
      }

      const lessonPageRoot = document.getElementById('lesson-page-root');

      const lessonPageToken = "{{ lesson_token|default:''|escapejs }}" || String(qs.get('token') || '').trim();
      const cabinetAssignmentFromServer = "{{ cabinet_assignment|default:''|escapejs }}".trim();
      const cabinetSessionFromServer = "{{ cabinet_session|default:''|escapejs }}".trim();
      const homeworkModeFromServer = "{{ homework_mode|yesno:'true,false' }}" === "true";
      const isHomeworkSession = (() => {
        const cabS = String(
          cabinetSessionFromServer ||
          qs.get("cabinet_session") ||
          qs.get("cabinetSession") ||
          ""
        ).trim().toLowerCase();
        const pSk = String(payload.session_kind || payload.sessionKind || "").trim().toLowerCase();
        const pLf = String(payload.lesson_format || payload.lessonFormat || "").trim().toLowerCase();
        return (
          homeworkModeFromServer ||
          cabS === "homework" ||
          pSk === "homework" ||
          pLf === "homework" ||
          !!cabinetAssignmentFromServer
        );
      })();
      const withLessonIframeParams = (urlStr) => {
        const raw = String(urlStr || "").trim();
        if (!raw) return raw;
        if (/\/lesson\/join\/?/i.test(raw)) return raw;
        const pickCab = (a, b) => (String(a || "").trim() || String(b || "").trim());
        const cabA = pickCab(
          cabinetAssignmentFromServer,
          qs.get("cabinet_assignment") || qs.get("cabinetAssignment")
        );
        const cabS = pickCab(
          cabinetSessionFromServer,
          qs.get("cabinet_session") || qs.get("cabinetSession")
        );
        const pSk = payload.session_kind || payload.sessionKind || "";
        const pLf = payload.lesson_format || payload.lessonFormat || "";
        const hJwt =
          String(pSk).toLowerCase() === "homework" ||
          String(pLf).toLowerCase() === "homework";
        const hUrl =
          homeworkModeFromServer ||
          cabS.toLowerCase() === "homework" ||
          hJwt ||
          !!String(cabA).trim();
        try {
          const u = new URL(raw, location.origin);
          u.searchParams.delete("token");
          if (lessonPageToken) {
            u.searchParams.set("lesson_embed", "1");
            u.searchParams.set("lesson_token", lessonPageToken);
            u.searchParams.set("lesson_student", isTeacher ? "0" : "1");
            if (participantName) u.searchParams.set("lesson_peer", participantName);
          }
          if (hUrl) u.searchParams.set("homework_mode", "1");
          if (cabA) u.searchParams.set("cabinet_assignment", cabA);
          if (cabS) u.searchParams.set("cabinet_session", cabS);
          return u.pathname + u.search + u.hash;
        } catch (_) {
          return raw;
        }
      };

      const pick = (...vals) => {
        for (const v of vals) {
          const s = String(v == null ? "" : v).trim();
          if (s) return s;
        }
        return "";
      };
      const byPath = (obj, path) => {
        let cur = obj;
        for (const p of path) {
          if (!cur || typeof cur !== "object") return "";
          cur = cur[p];
        }
        return cur == null ? "" : String(cur).trim();
      };

      const level = pick(levelFromServer, qs.get("level"), payload.level, payload.exam_level, payload.lesson_level, byPath(payload, ["variant", "level"]))
        .toLowerCase();
      const subject = pick(subjectFromServer, qs.get("subject"), payload.subject, payload.subject_short, payload.exam_subject, payload.lesson_subject, byPath(payload, ["variant", "subject"]), byPath(payload, ["variant", "subject_short"]))
        .toLowerCase();
      const variantId = pick(variantIdFromServer, qs.get("variant_id"), qs.get("variant"), qs.get("vid"), payload.variant_id, payload.variantId, payload.lesson_variant_id, payload.test_variant_id, byPath(payload, ["variant", "id"]), byPath(payload, ["variant", "variant_id"]));
      const directUrl = pick(variantUrlFromServer, qs.get("variant_url"), qs.get("url"), qs.get("link"), payload.variant_url, payload.variantUrl, payload.variant_link, payload.url, payload.link, byPath(payload, ["variant", "url"]), byPath(payload, ["variant", "link"]));

      /** Главная страница ЛК (без /app или /dashboard) — для редиректа после завершения урока */
      const lkHomeUrl = "{{ lk_home_url|default:''|escapejs }}".trim();
      const buildLessonReportDownloadUrl = (format) => {
        const p = new URLSearchParams();
        if (lessonPageToken) {
          p.set('token', lessonPageToken);
          p.set('role', 'teacher');
        } else {
          p.set('room_id', roomId);
        }
        if (variantId) p.set('variant_id', String(variantId));
        p.set('format', format);
        return `/api/lesson/report/download/?${p.toString()}`;
      };
      /** После окончания урока: переход на главную ЛК. */
      const redirectToLkAfterLessonEnd = () => {
        const target = lkHomeUrl || '/';
        setTimeout(() => { window.location.href = target; }, 450);
      };

      let src = (directUrl && !/\/lesson\/join\/?/i.test(directUrl))
        ? directUrl
        : (level && subject && variantId ? `/${level}/${subject}/variant/${variantId}/` : "");
      if (src) src = withLessonIframeParams(src);

      const waitingVariantForStudent = !src && !isTeacher;
      if (!src && isTeacher) {
        fallback.innerHTML =
          "Не удалось определить ссылку варианта.<br>" +
          `role=${role || "—"}, level=${level || "—"}, subject=${subject || "—"}, variant_id=${variantId || "—"}, variant_url=${directUrl || "—"}`;
        fallback.classList.add("show");
        return;
      }
      if (waitingVariantForStudent) {
        fallback.innerHTML = "Ожидание варианта от учителя...";
        fallback.classList.add("show");
      }

      const wsProto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${wsProto}://${location.host}/ws/lesson/${encodeURIComponent(roomId)}/`);
      const me = participantName || (isTeacher ? "Учитель" : "Ученик");
      const participants = { [me]: isTeacher ? "teacher" : "student" };
      const cursors = {}; // { name: {x, y, role} }
      let cursorLayer = null;
      let variantLoaded = false;
      let wsReady = false;
      let announcedVariantKey = "";
      const sendWs = (payload) => {
        if (!payload || ws.readyState !== WebSocket.OPEN) return false;
        try {
          ws.send(JSON.stringify(payload));
          return true;
        } catch (_) {
          return false;
        }
      };
      
      // --- Whiteboard Logic ---
      const WB_TOOLS = [
        { id: 'pointer', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg>', name: 'Указатель' },
        { id: 'pen', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>', name: 'Перо' },
        { id: 'eraser', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L20 9C20.5 9.5 20.5 10.5 20 11L11 20H20V20Z"/></svg>', name: 'Ластик' },
        { id: 'line', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/></svg>', name: 'Линия' },
        { id: 'arrow', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="12 5 19 5 19 12"/></svg>', name: 'Стрелка' },
        { id: 'rect', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>', name: 'Прямоугольник' },
        { id: 'ellipse', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>', name: 'Круг' },
        { id: 'triangle', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L2 21h20L12 3z"/></svg>', name: 'Треугольник' },
        { id: 'text', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>', name: 'Текст' }
      ];
      const WB_COLORS = [
        '#1E2A4A', '#E24B4A', '#378ADD', '#1D9E75', '#EF9F27', '#FFFFFF'
      ];
      const WbState = {
        strokes: [],
        undoneStrokes: [],
        activeStroke: null,
        tool: 'pointer',
        color: '#E24B4A',
        width: 3,
        opacity: 1.0,
        dirty: true,
        renderPending: false,
        emit() {
          this.dirty = true;
          if (!this.renderPending) {
            this.renderPending = true;
            requestAnimationFrame(() => {
              renderWhiteboard();
              this.renderPending = false;
            });
          }
        }
      };

      const wbCanvas = document.getElementById('whiteboard-canvas');
      const wbCtx = wbCanvas ? wbCanvas.getContext('2d', { alpha: true }) : null;
      const wbTextInput = document.getElementById('wb-text-input');
      const wbToolbar = document.getElementById('whiteboard-toolbar');
      let wbIsDrawing = false;

      let currentScale = 1;

      const resizeWb = () => {
        if (!wbCanvas || !wbCtx) return;
        const rect = wbCanvas.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        // Internal resolution should match the unscaled size (900px)
        const unscaledWidth = wbCanvas.parentElement.offsetWidth;
        const unscaledHeight = wbCanvas.parentElement.offsetHeight;
        wbCanvas.width = unscaledWidth * dpr;
        wbCanvas.height = unscaledHeight * dpr;
        wbCtx.scale(dpr, dpr);
        WbState.emit();
      };
      window.addEventListener('resize', resizeWb);

      const buildWbToolbar = () => {
        if (!wbToolbar) return;
        wbToolbar.innerHTML = '';
        
        let activePopover = null;
        const closePopovers = () => {
          document.querySelectorAll('.wb-tool-popover, .wb-color-popover').forEach(p => p.classList.remove('show'));
        };
        document.addEventListener('click', closePopovers);

        WB_TOOLS.forEach(t => {
          const wrap = document.createElement('div'); wrap.className = 'wb-tool-wrapper';
          const btn = document.createElement('button');
          btn.className = 'wb-tool-btn' + (WbState.tool === t.id ? ' active' : '');
          btn.innerHTML = t.icon;
          btn.title = t.name;
          btn.dataset.tool = t.id;
          
          let popover = null;
          if (t.id !== 'pointer') {
            popover = document.createElement('div'); popover.className = 'wb-tool-popover';
            popover.innerHTML = `<span class="wb-control-label">Толщина</span><input type="range" class="wb-control-slider" min="1" max="20" step="1" value="${WbState.width}">`;
            popover.querySelector('input').oninput = (e) => { WbState.width = parseInt(e.target.value); };
            popover.onclick = (e) => e.stopPropagation();
            wrap.appendChild(popover);
          }

          btn.onclick = (e) => {
            e.stopPropagation();
            if (WbState.tool === t.id && popover) {
              closePopovers();
              popover.classList.toggle('show');
            } else {
              closePopovers();
              WbState.tool = t.id;
              wbCanvas.classList.toggle('drawing-mode', t.id !== 'pointer');
              refreshWbToolbar();
            }
          };
          
          wrap.appendChild(btn);
          wbToolbar.appendChild(wrap);
        });
        
        const sep1 = document.createElement('div'); sep1.className = 'wb-divider'; wbToolbar.appendChild(sep1);
        
        const colorWrap = document.createElement('div'); colorWrap.className = 'wb-color-wrapper';
        const colorBtn = document.createElement('div'); colorBtn.className = 'wb-color-picker-btn';
        colorBtn.style.backgroundColor = WbState.color;
        const colorPopover = document.createElement('div'); colorPopover.className = 'wb-color-popover';
        colorPopover.onclick = (e) => e.stopPropagation();
        
        WB_COLORS.forEach(c => {
          const sw = document.createElement('div');
          sw.className = 'wb-color-swatch' + (WbState.color === c ? ' active' : '');
          sw.style.backgroundColor = c;
          sw.style.setProperty('--swatch-color', c);
          sw.dataset.color = c;
          sw.onclick = (e) => { 
            e.stopPropagation();
            WbState.color = c; 
            colorBtn.style.backgroundColor = c;
            closePopovers();
            refreshWbToolbar(); 
          };
          colorPopover.appendChild(sw);
        });
        
        colorBtn.onclick = (e) => {
          e.stopPropagation();
          const isShowing = colorPopover.classList.contains('show');
          closePopovers();
          if (!isShowing) colorPopover.classList.add('show');
        };
        
        colorWrap.appendChild(colorBtn);
        colorWrap.appendChild(colorPopover);
        wbToolbar.appendChild(colorWrap);
        
        const sep2 = document.createElement('div'); sep2.className = 'wb-divider'; wbToolbar.appendChild(sep2);
        
        const undoBtn = document.createElement('button'); undoBtn.className = 'wb-tool-btn'; undoBtn.title = 'Отменить';
        undoBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>';
        undoBtn.onclick = () => { 
          for (let i = WbState.strokes.length - 1; i >= 0; i--) {
            if (WbState.strokes[i].author === me) {
              const removed = WbState.strokes.splice(i, 1)[0];
              WbState.undoneStrokes.push(removed);
              sendWs({ type: 'wb_undo', author: me, strokeId: removed.id });
              WbState.emit();
              break;
            }
          }
        };
        wbToolbar.appendChild(undoBtn);
        
        const redoBtn = document.createElement('button'); redoBtn.className = 'wb-tool-btn'; redoBtn.title = 'Вернуть';
        redoBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3l3 4.7"/></svg>';
        redoBtn.onclick = () => {
          if (WbState.undoneStrokes.length > 0) {
            const s = WbState.undoneStrokes.pop();
            WbState.strokes.push(s);
            sendWs({ type: 'wb_stroke_add', stroke: s });
            WbState.emit();
          }
        };
        wbToolbar.appendChild(redoBtn);
        
        const clearBtn = document.createElement('button'); clearBtn.className = 'wb-tool-btn'; clearBtn.title = 'Очистить';
        clearBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#E24B4A" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
        clearBtn.onclick = () => { if(confirm('Очистить доску для всех?')) sendWs({ type: 'wb_clear_all' }); };
        wbToolbar.appendChild(clearBtn);
      };

      const refreshWbToolbar = () => {
        if (!wbToolbar) return;
        wbToolbar.querySelectorAll('.wb-tool-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tool === WbState.tool));
        wbToolbar.querySelectorAll('.wb-color-swatch').forEach(sw => sw.classList.toggle('active', sw.dataset.color === WbState.color));
      };

            const getWbMetrics = () => {
        try {
          const frame = document.getElementById('variant-frame');
          const doc = frame.contentDocument;
          if (!doc) return null;
          const page = doc.querySelector('.page') || doc.querySelector('#main-wrapper') || doc.querySelector('.main-wrapper') || doc.body;
          
          const rect = page.getBoundingClientRect();
          
          return {
            left: rect.left,
            top: rect.top,
            width: rect.width || 1
          };
        } catch(e) {
          return null;
        }
      };

      const getWbNormCoords = (e) => {
        let cx, cy;
        if (e.touches && e.touches.length > 0) {
          cx = e.touches[0].clientX; cy = e.touches[0].clientY;
        } else {
          cx = e.clientX; cy = e.clientY;
        }
        const canvasRect = wbCanvas.getBoundingClientRect();
        const localX = cx - canvasRect.left;
        const localY = cy - canvasRect.top;
        
        const m = getWbMetrics();
        if (!m || m.width === 0) return { x: 0, y: 0 };
        
        const pt = {
          x: (localX - m.left) / m.width,
          y: (localY - m.top) / m.width
        };

        // Task-anchored Y: store which task and relative Y within it.
        // This makes strokes stable across devices with different screen widths
        // (where content reflow changes absolute Y positions).
        try {
          const iframeDoc = frame?.contentDocument;
          if (iframeDoc) {
            const tasks = iframeDoc.querySelectorAll('.task, section.task, .task-in-group');
            for (const task of tasks) {
              const tr = task.getBoundingClientRect(); // in iframe viewport (= canvas viewport)
              if (localY >= tr.top && localY <= tr.bottom && tr.height > 0) {
                const numEl = task.querySelector('.task-number');
                if (numEl) {
                  pt.taskNum = numEl.textContent.trim();
                  pt.ty = (localY - tr.top) / tr.height; // 0..1 within this task's height
                }
                break;
              }
            }
          }
        } catch (_) {}

        return pt;
      };

      const renderWhiteboard = () => {
        if (!WbState.dirty || !wbCtx || !wbCanvas) return;
        WbState.dirty = false;
        wbCtx.clearRect(0, 0, wbCanvas.width, wbCanvas.height);
        
        const m = getWbMetrics();
        if (!m) return;

        const toAbsX = (nx) => nx * m.width + m.left;
        const toAbsY = (ny) => ny * m.width + m.top;

        // Build task-rect cache for task-anchored rendering
        const taskRects = {};
        try {
          const iframeDoc = frame?.contentDocument;
          if (iframeDoc) {
            iframeDoc.querySelectorAll('.task, section.task, .task-in-group').forEach(task => {
              const numEl = task.querySelector('.task-number');
              if (numEl) taskRects[numEl.textContent.trim()] = task.getBoundingClientRect();
            });
          }
        } catch (_) {}

        // Resolve a point to absolute canvas coordinates.
        // Prefers task-relative coords (taskNum + ty) for cross-device accuracy,
        // falls back to page-width-normalized coords.
        const resolvePoint = (pt) => {
          if (pt && pt.taskNum && pt.ty != null && taskRects[pt.taskNum]) {
            const tr = taskRects[pt.taskNum];
            return { x: toAbsX(pt.x), y: tr.top + pt.ty * tr.height };
          }
          return { x: toAbsX(pt.x), y: toAbsY(pt.y) };
        };
        
        const drawStroke = (s, isGhost) => {
          if (!s) return;
          wbCtx.save();
          wbCtx.globalAlpha = isGhost ? s.opacity * 0.6 : s.opacity;
          wbCtx.strokeStyle = s.color;
          wbCtx.fillStyle = s.color;
          wbCtx.lineWidth = s.width;
          wbCtx.lineCap = 'round';
          wbCtx.lineJoin = 'round';

          if (s.tool === 'pen' && s.points && s.points.length > 0) {
            const p0 = resolvePoint(s.points[0]);
            wbCtx.beginPath();
            wbCtx.moveTo(p0.x, p0.y);
            for (let i = 1; i < s.points.length; i++) {
              const p = resolvePoint(s.points[i]);
              wbCtx.lineTo(p.x, p.y);
            }
            wbCtx.stroke();
          } else if (s.startPoint && s.endPoint) {
            const sp = resolvePoint(s.startPoint);
            const ep = resolvePoint(s.endPoint);
            const sx = sp.x, sy = sp.y, ex = ep.x, ey = ep.y;
            if (s.tool === 'line' || s.tool === 'arrow') {
              wbCtx.beginPath(); wbCtx.moveTo(sx, sy); wbCtx.lineTo(ex, ey); wbCtx.stroke();
              if (s.tool === 'arrow') {
                const angle = Math.atan2(ey - sy, ex - sx);
                const dist = Math.hypot(ex - sx, ey - sy);
                const headLen = Math.min(20, dist * 0.25);
                wbCtx.beginPath();
                wbCtx.moveTo(ex, ey);
                wbCtx.lineTo(ex - headLen * Math.cos(angle - Math.PI / 7), ey - headLen * Math.sin(angle - Math.PI / 7));
                wbCtx.moveTo(ex, ey);
                wbCtx.lineTo(ex - headLen * Math.cos(angle + Math.PI / 7), ey - headLen * Math.sin(angle + Math.PI / 7));
                wbCtx.stroke();
              }
            } else if (s.tool === 'rect') {
              wbCtx.beginPath(); wbCtx.rect(sx, sy, ex - sx, ey - sy); wbCtx.stroke();
            } else if (s.tool === 'ellipse') {
              const cx = (sx + ex) / 2, cy = (sy + ey) / 2;
              const rx = Math.abs(ex - sx) / 2, ry = Math.abs(ey - sy) / 2;
              wbCtx.beginPath(); wbCtx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI); wbCtx.stroke();
            } else if (s.tool === 'triangle') {
              const cx = (sx + ex) / 2;
              wbCtx.beginPath(); wbCtx.moveTo(cx, sy); wbCtx.lineTo(sx, ey); wbCtx.lineTo(ex, ey); wbCtx.closePath(); wbCtx.stroke();
            }
          } else if (s.tool === 'text' && s.text && s.startPoint) {
            const sp = resolvePoint(s.startPoint);
            wbCtx.font = `500 ${s.width * 6}px sans-serif`;
            wbCtx.textBaseline = 'top';
            wbCtx.fillText(s.text, sp.x, sp.y);
          }
          wbCtx.restore();
        };

        WbState.strokes.forEach(s => drawStroke(s));
        if (WbState.activeStroke) drawStroke(WbState.activeStroke, true);
      };

      if (wbCanvas) {
        const eraseAt = (pt) => {
          const m = getWbMetrics();
          const eraserRadiusNorm = m && m.width > 0 ? (WbState.width * 2) / m.width : WbState.width * 2;
          const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);
          const erasedIds = [];
          
          WbState.strokes = WbState.strokes.filter(s => {
            if (s.tool === 'pen') {
              if (s.points.some(p => dist(p, pt) < eraserRadiusNorm)) { erasedIds.push(s.id); return false; }
            } else if (s.startPoint) {
              const minX = Math.min(s.startPoint.x, s.endPoint?.x || s.startPoint.x);
              const maxX = Math.max(s.startPoint.x, s.endPoint?.x || s.startPoint.x);
              const minY = Math.min(s.startPoint.y, s.endPoint?.y || s.startPoint.y);
              const maxY = Math.max(s.startPoint.y, s.endPoint?.y || s.startPoint.y);
              const inBounds = pt.x >= minX - eraserRadiusNorm && pt.x <= maxX + eraserRadiusNorm &&
                               pt.y >= minY - eraserRadiusNorm && pt.y <= maxY + eraserRadiusNorm;
              if (inBounds) { erasedIds.push(s.id); return false; }
            }
            return true;
          });
          if (erasedIds.length > 0) {
            sendWs({ type: 'wb_strokes_erase', ids: erasedIds });
            WbState.emit();
          }
        };

        const handleTextClick = (e) => {
          const pt = getWbNormCoords(e);
          const m = getWbMetrics();
          if (!m) return;
          
          const unscaledX = pt.x * m.width + m.left;
          const unscaledY = pt.y * m.width + m.top;

          wbTextInput.style.display = 'block';
          wbTextInput.style.left = `${unscaledX}px`;
          wbTextInput.style.top = `${unscaledY - 10}px`;
          wbTextInput.style.color = WbState.color;
          wbTextInput.style.font = `500 ${WbState.width * 6}px sans-serif`;
          wbTextInput.value = '';
          wbTextInput.focus();

          const commitText = () => {
            if (wbTextInput.style.display === 'none') return;
            const text = wbTextInput.value.trim();
            wbTextInput.style.display = 'none';
            if (text) {
              const s = {
                id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                tool: 'text', color: WbState.color, width: WbState.width, opacity: WbState.opacity,
                text: text, startPoint: pt, author: me, timestamp: Date.now(),
                taskId: pt.taskId, taskTopNorm: pt.taskTopNorm
              };
              WbState.strokes.push(s);
              WbState.undoneStrokes = [];
              sendWs({ type: 'wb_stroke_add', stroke: s });
              WbState.emit();
            }
          };
          wbTextInput.onblur = commitText;
          wbTextInput.onkeydown = (k) => { if (k.key === 'Enter') commitText(); };
        };

        const onStart = (e) => {
          if (e.target === wbTextInput || WbState.tool === 'pointer') return;
          e.preventDefault();
          if (WbState.tool === 'text') { handleTextClick(e); return; }
          wbIsDrawing = true;
          const pt = getWbNormCoords(e);
          if (WbState.tool === 'eraser') { eraseAt(pt); return; }
          const s = {
            id: Date.now().toString(36) + Math.random().toString(36).substr(2),
            tool: WbState.tool, color: WbState.color, width: WbState.width, opacity: WbState.opacity,
            author: me, timestamp: Date.now(),
            taskId: pt.taskId, taskTopNorm: pt.taskTopNorm
          };
          if (WbState.tool === 'pen') s.points = [pt];
          else { s.startPoint = pt; s.endPoint = pt; }
          WbState.activeStroke = s;
          sendWs({ type: 'wb_stroke_active', stroke: s });
          WbState.emit();
        };

        const onMove = (e) => {
          if (e.target === wbTextInput || WbState.tool === 'pointer') return;
          if (!wbIsDrawing) return;
          e.preventDefault();
          const pt = getWbNormCoords(e);
          if (WbState.tool === 'eraser') { eraseAt(pt); return; }
          if (WbState.activeStroke) {
            const s = { ...WbState.activeStroke };
            if (s.tool === 'pen') s.points = [...s.points, pt];
            else s.endPoint = pt;
            WbState.activeStroke = s;
            sendWs({ type: 'wb_stroke_active', stroke: s });
            WbState.emit();
          }
        };

        const onEnd = (e) => {
          if (e.target === wbTextInput || WbState.tool === 'pointer') return;
          if (!wbIsDrawing) return;
          wbIsDrawing = false;
          if (WbState.tool !== 'eraser' && WbState.activeStroke) {
            WbState.strokes.push(WbState.activeStroke);
            WbState.undoneStrokes = [];
            sendWs({ type: 'wb_stroke_add', stroke: WbState.activeStroke });
            WbState.activeStroke = null;
            sendWs({ type: 'wb_stroke_active', stroke: null });
            WbState.emit();
          }
        };

        wbCanvas.addEventListener('mousedown', onStart);
        wbCanvas.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        wbCanvas.addEventListener('touchstart', onStart, {passive: false});
        wbCanvas.addEventListener('touchmove', onMove, {passive: false});
        window.addEventListener('touchend', onEnd);
      }

      buildWbToolbar();
      resizeWb();
      // --- End Whiteboard Logic ---

      const pendingBoardObjects = [];
      const flushPendingBoardObjects = () => {
        if (ws.readyState !== WebSocket.OPEN) return;
        while (pendingBoardObjects.length) {
          const payload = pendingBoardObjects.shift();
          sendWs(payload);
        }
      };
      const normalizeTaskNumber = (value) => {
        const raw = String(value == null ? "" : value).trim();
        if (!raw) return "";
        const digitsOnly = raw.replace(/[^\d]+/g, "");
        return digitsOnly || raw;
      };
      /** Ключ в answersByTask: по id задания варианта (Task.id) — устраняет склейку при одинаковых номерах в UI. */
      const answerKeyFromStoredTaskNumber = (stored) => {
        const s = String(stored == null ? "" : stored).trim();
        if (s.length >= 2 && s[0] === "t" && /^\d+$/.test(s.slice(1))) return s;
        return "n" + normalizeTaskNumber(s);
      };
      const answerKeyFromDomTask = (task) => {
        if (!task) return "";
        const tid = String(task.getAttribute("data-task-id") || "").trim();
        if (tid && /^\d+$/.test(tid)) return "t" + tid;
        const ne = task.querySelector(".task-left .task-number") || task.querySelector(".task-number");
        return "n" + normalizeTaskNumber(ne ? ne.textContent : "");
      };
      /** Ключ для вложений (тот же смысл, что у ответов): t<id> или n<номер>. */
      const attachmentKeyFromApiItem = (item) => {
        if (!item) return "";
        const raw = item.task_id != null ? String(item.task_id).trim() : "";
        if (raw && /^\d+$/.test(raw)) return "t" + raw;
        return answerKeyFromStoredTaskNumber(item.task_number);
      };
      const toFiniteOrNull = (value) => {
        const n = Number(value);
        return Number.isFinite(n) ? n : null;
      };

      const buildVariantSrc = (url, lvl, subj, vId) => {
        const direct = String(url || '').trim();
        if (direct && !/\/lesson\/join\/?/i.test(direct)) return direct;
        const levelSafe = String(lvl || '').trim().toLowerCase();
        const subjectSafe = String(subj || '').trim().toLowerCase();
        const idSafe = String(vId || '').trim();
        if (levelSafe && subjectSafe && idSafe) return `/${levelSafe}/${subjectSafe}/variant/${idSafe}/`;
        return "";
      };
      const openVariantIfReady = (candidateSrc) => {
        const s = String(candidateSrc || '').trim();
        if (!s || variantLoaded) return false;
        const out = withLessonIframeParams(s);
        src = out;
        variantLoaded = true;
        fallback.classList.remove("show");
        frame.src = out;
        frame.style.display = 'block';
        return true;
      };
      const parseVariantMetaFromSrc = (candidateSrc) => {
        try {
          const path = new URL(String(candidateSrc || ''), location.origin).pathname;
          const m = path.match(/^\/([^/]+)\/([^/]+)\/variant\/([0-9]+)\/?$/i);
          if (!m) return null;
          return {
            level: String(m[1] || '').trim().toLowerCase(),
            subject: String(m[2] || '').trim().toLowerCase(),
            variant_id: Number(m[3]) || 0,
          };
        } catch (_) {
          return null;
        }
      };
      const announceVariant = () => {
        if (!isTeacher || !wsReady) return;
        const fromSrc = parseVariantMetaFromSrc(src);
        const levelSafe = String((fromSrc && fromSrc.level) || level || '').trim().toLowerCase();
        const subjectSafe = String((fromSrc && fromSrc.subject) || subject || '').trim().toLowerCase();
        const variantIdNum = Number((fromSrc && fromSrc.variant_id) || variantId || 0);
        if (!levelSafe || !subjectSafe || !variantIdNum) return;
        const key = `${levelSafe}:${subjectSafe}:${variantIdNum}`;
        if (key === announcedVariantKey) return;
        announcedVariantKey = key;
        sendWs({
          type: 'variant',
          level: levelSafe,
          subject: subjectSafe,
          variant_id: variantIdNum,
        });
      };

      ws.onopen = () => {
        wsReady = true;
        sendWs({ type: "join", name: me, role: participants[me] });
        flushPendingBoardObjects();
        announceVariant();
      };

      const normalizeAnswer = (s) => String(s || "").toLowerCase().replace(/\s+/g, "").trim();
      const stripHtml = (html) => {
        const d = document.createElement("div");
        d.innerHTML = String(html || "");
        return d.textContent || d.innerText || "";
      };

      let answerByTaskNum = {};
      let maxScoreByTaskNum = {};
      let taskListIdByNum = {};
      let lessonCriteriaCache = {};
      let answersByTask = {};
      let attachmentsByTask = {};
      let teacherResultsPollTimer = null;
      let taskObserver = null;
      /** Пока правим DOM в iframe, отключаем MutationObserver — иначе patchTeacherView → мутация → снова observer → бесконечный цикл («страница не отвечает»). */
      function withTeacherMutationsPaused(doc, fn) {
        if (!doc) return;
        const obs = taskObserver;
        if (obs) {
          try { obs.disconnect(); } catch (e) {}
        }
        try {
          fn();
        } finally {
          if (obs && doc.body) {
            try {
              obs.observe(doc.body, { childList: true, subtree: true });
            } catch (e) {}
          }
        }
      }
      let canvasObserver = null;
      let canvasPollTimer = null;
      const syncTimers = {};
      const lastCanvasHash = {};
      const submittedTaskNumbers = {}; // { "1": true, ... } — ученик уже отправил ответ

      const getDoc = () => frame.contentDocument;

      /** Та же логика, что boardCoordsFromClient в ExamPage: точка относительно #main-wrapper. */
      const getLessonMainWrapper = (doc) => {
        const d = doc || getDoc();
        if (!d || !d.querySelector) return null;
        return d.querySelector('.page') || d.querySelector('#main-wrapper') || d.querySelector('.main-wrapper');
      };

      const cursorNormFromClient = (doc, clientX, clientY) => {
        const wrap = getLessonMainWrapper(doc);
        if (!wrap) return null;
        const mr = wrap.getBoundingClientRect();
        const sw = Math.max(1, wrap.scrollWidth || 1);
        const sh = Math.max(1, wrap.scrollHeight || 1);
        if (!(mr.width > 0) || !(mr.height > 0)) return null;
        const sx = sw / mr.width;
        const sy = sh / mr.height;
        const boardX = (Number(clientX) - mr.left) * sx;
        const boardY = (Number(clientY) - mr.top) * sy;
        return {
          nx: boardX / sw,
          ny: boardY / sh,
        };
      };

      const cursorClientFromNorm = (doc, nx, ny) => {
        const wrap = getLessonMainWrapper(doc);
        if (wrap == null || nx == null || ny == null) return null;
        const nxx = Number(nx);
        const nyy = Number(ny);
        if (!Number.isFinite(nxx) || !Number.isFinite(nyy)) return null;
        const mr = wrap.getBoundingClientRect();
        const sw = Math.max(1, wrap.scrollWidth || 1);
        const sh = Math.max(1, wrap.scrollHeight || 1);
        if (!(mr.width > 0) || !(mr.height > 0)) return null;
        const sx = sw / mr.width;
        const sy = sh / mr.height;
        const boardX = nxx * sw;
        const boardY = nyy * sh;
        return {
          x: mr.left + boardX / sx,
          y: mr.top + boardY / sy,
        };
      };

      let cursorRenderRaf = null;
      const scheduleCursorRedraw = () => {
        if (cursorRenderRaf != null) return;
        cursorRenderRaf = requestAnimationFrame(() => {
          cursorRenderRaf = null;
          renderCursors();
        });
      };

      const getDocMetrics = (doc) => {
        const d = doc || getDoc();
        if (!d) {
          return {
            viewportW: 1,
            viewportH: 1,
            contentW: 1,
            contentH: 1,
            scrollX: 0,
            scrollY: 0,
          };
        }
        const win = d.defaultView || window;
        const root = d.documentElement || d.body;
        const body = d.body || root;
        const viewportW = Math.max(1, Number(win.innerWidth) || root.clientWidth || body.clientWidth || 1);
        const viewportH = Math.max(1, Number(win.innerHeight) || root.clientHeight || body.clientHeight || 1);
        const contentW = Math.max(viewportW, root.scrollWidth || 0, body.scrollWidth || 0);
        const contentH = Math.max(viewportH, root.scrollHeight || 0, body.scrollHeight || 0);
        const scrollX = Number(win.scrollX ?? root.scrollLeft ?? body.scrollLeft ?? 0) || 0;
        const scrollY = Number(win.scrollY ?? root.scrollTop ?? body.scrollTop ?? 0) || 0;
        return { viewportW, viewportH, contentW, contentH, scrollX, scrollY };
      };

      const ensureCursorLayer = (doc) => {
        if (!doc) return null;
        let layer = doc.getElementById('lesson-cursors-layer');
        if (!layer) {
          layer = doc.createElement('div');
          layer.id = 'lesson-cursors-layer';
          doc.body.appendChild(layer);
        }
        cursorLayer = layer;
        return layer;
      };

      const cursorHueForName = (name) => {
        let h = 0;
        const s = String(name || '');
        for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
        return Math.abs(h) % 360;
      };

      const renderCursors = () => {
        const doc = getDoc();
        if (!doc) return;
        const layer = ensureCursorLayer(doc);
        if (!layer) return;
        const metrics = getDocMetrics(doc);
        const rows = [];
        for (const [name, cur] of Object.entries(cursors)) {
          if (!cur) continue;
          let x = toFiniteOrNull(cur.x);
          let y = toFiniteOrNull(cur.y);
          const nx = toFiniteOrNull(cur.nx);
          const ny = toFiniteOrNull(cur.ny);
          const rx = toFiniteOrNull(cur.rx);
          const ry = toFiniteOrNull(cur.ry);
          const vx = toFiniteOrNull(cur.vx);
          const vy = toFiniteOrNull(cur.vy);
          if (nx != null && ny != null) {
            const p = cursorClientFromNorm(doc, nx, ny);
            if (p) {
              x = p.x;
              y = p.y;
            }
          }
          if ((x == null || y == null) && rx != null && ry != null) {
            x = rx * metrics.contentW - metrics.scrollX;
            y = ry * metrics.contentH - metrics.scrollY;
          }
          if ((x == null || y == null) && vx != null && vy != null) {
            x = vx * metrics.viewportW;
            y = vy * metrics.viewportH;
          }
          if (x == null || y == null) continue;
          x = Math.max(-32, Math.min(metrics.viewportW + 32, x));
          y = Math.max(-32, Math.min(metrics.viewportH + 32, y));
          const safeName = String(name || 'Участник')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
          const roleVal = String(cur.role || participants[name] || '').toLowerCase();
          const isTeacherCur = roleVal === 'teacher' || roleVal === 'tutor';
          const cursorCls = isTeacherCur ? 'lesson-cursor lesson-cursor--teacher' : 'lesson-cursor lesson-cursor--student';
          const dotBg = isTeacherCur
            ? '#ea580c'
            : `hsl(${cursorHueForName(name)}, 78%, 46%)`;
          rows.push(
            `<div class="${cursorCls}" style="left:${x}px;top:${y}px">` +
            `<span class="lesson-cursor-dot" style="background:${dotBg}"></span>` +
            `<span class="lesson-cursor-name">${safeName}</span>` +
            `</div>`
          );
        }
        layer.innerHTML = rows.join('');
      };

      const renderParticipants = () => {
        const doc = getDoc();
        if (!doc) return;
        const heroRight = doc.querySelector('.variant-hero-right') || doc.querySelector('.variant-hero-content');
        if (!heroRight) return;
        const apply = () => {
          let wrap = doc.getElementById('lesson-participants-wrap');
          if (!wrap) {
            wrap = doc.createElement('div');
            wrap.id = 'lesson-participants-wrap';
            heroRight.appendChild(wrap);
          }
          const names = Object.keys(participants).sort((a, b) => a.localeCompare(b, 'ru'));
          wrap.innerHTML = `
          <div class="lesson-participants-title">Участники онлайн: ${names.length}</div>
          <div class="lesson-participants-list">${names.map((n) => `<span class="lesson-participant-chip">${n}</span>`).join('')}</div>
        `;
        };
        if (isTeacher) withTeacherMutationsPaused(doc, apply);
        else apply();
      };

      const safeHtml = (v) => String(v == null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      const escAttr = (v) => String(v == null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      const removeLessonResultsPanel = (doc) => {
        if (!doc) return;
        doc.getElementById('lesson-results-panel')?.remove();
      };

      const mergeTaskAnswersFromApi = (rows) => {
        if (!Array.isArray(rows) || !rows.length) return false;
        let changed = false;
        rows.forEach((row) => {
          const taskKey = answerKeyFromStoredTaskNumber(row.task_number);
          const displayNum = normalizeTaskNumber(row.task_number);
          const studentName = String((row && row.student) || '').trim();
          if (!taskKey || !studentName) return;
          const answer = String(row.answer || '');
          let ok = false;
          if (typeof row.is_correct === 'boolean') {
            ok = row.is_correct;
          } else if (taskKey.startsWith('n')) {
            ok = normalizeAnswer(answer) === normalizeAnswer(stripHtml(answerByTaskNum[displayNum] || ''));
          } else {
            ok = false;
          }
          const list = answersByTask[taskKey] || [];
          const idx = list.findIndex((r) => r.name === studentName);
          const newRow = { name: studentName, answer, ok };
          if (idx >= 0) {
            const prev = list[idx];
            if (prev.answer !== newRow.answer || prev.ok !== newRow.ok) {
              list[idx] = newRow;
              changed = true;
            }
          } else {
            list.push(newRow);
            answersByTask[taskKey] = list;
            changed = true;
          }
        });
        return changed;
      };

      const mergeAttachmentsFromApiItems = (items) => {
        if (!Array.isArray(items) || !items.length) return;
        items.forEach((item) => {
          const taskKey = attachmentKeyFromApiItem(item);
          if (!taskKey || !item.url) return;
          const row = {
            name: String(item.student || 'Ученик').trim() || 'Ученик',
            url: String(item.url || ''),
            filename: String(item.filename || ''),
          };
          attachmentsByTask[taskKey] = attachmentsByTask[taskKey] || [];
          if (!attachmentsByTask[taskKey].some((x) => x.url === row.url)) attachmentsByTask[taskKey].push(row);
        });
      };

      const renderLessonAttachments = (doc) => {
        if (!isTeacher || !doc) return;
        const token = String(qs.get('token') || '').trim();
        doc.querySelectorAll('.lesson-attachments-teacher').forEach((el) => el.remove());
        doc.querySelectorAll('.task').forEach((task) => {
          const numEl = task.querySelector('.task-number');
          const taskNum = numEl ? normalizeTaskNumber(numEl.textContent) : '';
          if (!taskNum) return;
          const taskKey = answerKeyFromDomTask(task);
          const taskIdAttr = String(task.getAttribute('data-task-id') || '').trim();
          const rows = attachmentsByTask[taskKey] || [];
          if (!rows.length) return;
          
          // Group by student
          const byStudent = {};
          rows.forEach(r => {
             if (!byStudent[r.name]) byStudent[r.name] = [];
             byStudent[r.name].push(r);
          });

          const wrap = doc.createElement('div');
          wrap.className = 'lesson-attachments-teacher';
          const maxScore = maxScoreByTaskNum[taskNum] || 1;
          
          let html = '<div class="lesson-attachments-title">Прикреплённые решения</div><div class="lesson-attachments-list" style="display:flex; flex-direction:column; gap:16px;">';
          
          for (const studentName in byStudent) {
             const studentAttachments = byStudent[studentName];
             
             let currentScore = '';
             const studentAnswers = answersByTask[taskKey] || [];
             const sa = studentAnswers.find(a => a.name === studentName);
             if (sa && sa.answer && sa.answer.startsWith('Оценка: ')) {
                currentScore = sa.answer.replace('Оценка: ', '').split(' ')[0];
             }
             
             let imagesHtml = '<div style="display:flex; flex-wrap:wrap; gap:8px;">';
             studentAttachments.forEach(r => {
                const imgUrl = token
                  ? (r.url + (String(r.url).includes('?') ? '&' : '?') + 't=' + encodeURIComponent(token))
                  : r.url;
                const cap = r.filename ? safeHtml(r.filename) : '';
                imagesHtml += `<a href="${String(imgUrl).replace(/"/g, '&quot;')}" target="_blank" style="display:block; width:120px; height:120px; border-radius:6px; overflow:hidden; border:1px solid #e2e8f0; position:relative;" title="${cap}">
                  <img src="${String(imgUrl).replace(/"/g, '&quot;')}" style="width:100%; height:100%; object-fit:contain; background:#f8fafc;" alt=""/>
                </a>`;
             });
             imagesHtml += '</div>';
             
             html += `
               <div class="lesson-student-attachment-row" style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:12px; background:#fff; border-radius:8px; border:1px solid #e2e8f0;">
                 <div style="flex:1; min-width:0;">
                   <div style="font-weight:600; font-size:0.85rem; color:#334155; margin-bottom:8px;">${safeHtml(studentName)}</div>
                   ${imagesHtml}
                 </div>
                 <div style="display:flex; align-items:center; gap:6px; background:#f8fafc; padding:6px 10px; border-radius:6px; border:1px solid #e2e8f0;">
                   <span style="font-size:0.8rem; color:#64748b; font-weight:500;">Балл:</span>
                   <input type="number" min="0" max="${maxScore}" value="${currentScore}" data-student="${safeHtml(studentName)}" data-task="${taskNum}" ${taskIdAttr ? `data-task-id="${escAttr(taskIdAttr)}"` : ''} class="lesson-score-input" style="width:48px; padding:4px; border:1px solid #cbd5e1; border-radius:4px; text-align:center; font-size:0.9rem; font-weight:600; color:#0f172a; outline:none;" />
                   <span style="font-size:0.85rem; color:#64748b; font-weight:500;">/ ${maxScore}</span>
                 </div>
               </div>
             `;
          }
          
          html += '</div>';
          wrap.innerHTML = html;
          
          const taskContent = task.querySelector('.task-content') || task;
          taskContent.appendChild(wrap);
        });
      };

      const refreshTeacherAnswerBlocks = (doc) => {
        if (doc) {
          withTeacherMutationsPaused(doc, () => {
            patchTeacherView(doc);
            renderLessonAttachments(doc);
            removeLessonResultsPanel(doc);
          });
        }
      };

      const scheduleTeacherAnswerRefresh = (doc) => {
        if (!doc) return;
        const run = () => refreshTeacherAnswerBlocks(doc);
        run();
        requestAnimationFrame(() => run());
        setTimeout(run, 60);
        setTimeout(run, 220);
      };

      const fetchTeacherResults = async () => {
        if (!isTeacher) return;
        const token = String(qs.get('token') || lessonPageToken || '').trim();
        const params = new URLSearchParams();
        if (token) params.set('token', token);
        else params.set('room_id', roomId);
        if (variantId) params.set('variant_id', String(variantId));
        try {
          if (token) {
            const p2 = new URLSearchParams(params);
            p2.set('role', 'teacher');
            const resTa = await fetch(`/api/lesson/task-answers/?${p2.toString()}`, { credentials: 'include' });
            const ta = await resTa.json();
            if (resTa.ok && ta && Array.isArray(ta.answers)) {
              mergeTaskAnswersFromApi(ta.answers);
            }
            const resAtt = await fetch(
              `/api/lesson/attachments/?token=${encodeURIComponent(token)}&role=teacher`,
              { credentials: 'include' }
            );
            const att = await resAtt.json();
            if (resAtt.ok && att && Array.isArray(att.items)) mergeAttachmentsFromApiItems(att.items);
          }
          const doc = getDoc();
          if (doc) {
            withTeacherMutationsPaused(doc, () => {
              patchTeacherView(doc);
              renderLessonAttachments(doc);
              removeLessonResultsPanel(doc);
            });
          }
        } catch (_) {}
      };

      const applyBoardSnapshot = (doc, msg) => {
        const id = String(msg.canvas_id || '').trim();
        const dataUrl = String(msg.data_url || '').trim();
        if (!id || !dataUrl) return;
        const canvas = doc.getElementById(id);
        if (!canvas || canvas.tagName !== 'CANVAS') return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        const img = new Image();
        img.onload = () => {
          const targetW = Number(canvas.width) || Number(msg.width) || img.naturalWidth || 0;
          const targetH = Number(canvas.height) || Number(msg.height) || img.naturalHeight || 0;
          if (!targetW || !targetH) return;
          ctx.clearRect(0, 0, targetW, targetH);
          ctx.drawImage(img, 0, 0, targetW, targetH);
        };
        img.src = dataUrl;
      };

      const queueCanvasSync = (canvas) => {
        if (!canvas || !canvas.id) return;
        if (canvas.dataset && canvas.dataset.lessonSkipRasterSync === '1') return;
        const id = canvas.id;
        if (syncTimers[id]) clearTimeout(syncTimers[id]);
        syncTimers[id] = setTimeout(() => {
          try {
            const dataUrl = canvas.toDataURL('image/png');
            const hash = `${canvas.width}x${canvas.height}:${dataUrl.length}:${dataUrl.slice(-64)}`;
            if (lastCanvasHash[id] === hash) return;
            lastCanvasHash[id] = hash;
            sendWs({
              type: 'board_sync',
              name: me,
              canvas_id: id,
              data_url: dataUrl,
              width: canvas.width,
              height: canvas.height,
            });
          } catch (_) {}
        }, 140);
      };

      const bindCanvasSync = (doc) => {
        const bind = (canvas) => {
          if (!canvas || canvas.dataset.lessonSyncBound === '1') return;
          canvas.dataset.lessonSyncBound = '1';
          const h = () => queueCanvasSync(canvas);
          canvas.addEventListener('pointerup', h, true);
          canvas.addEventListener('mouseup', h, true);
          canvas.addEventListener('touchend', h, true);
        };

        doc.querySelectorAll('canvas').forEach(bind);
        if (canvasObserver) canvasObserver.disconnect();
        if (canvasPollTimer) clearInterval(canvasPollTimer);
        canvasObserver = new MutationObserver((mutations) => {
          for (const m of mutations) {
            m.addedNodes.forEach((n) => {
              if (!(n instanceof Element)) return;
              if (n.tagName === 'CANVAS') bind(n);
              n.querySelectorAll?.('canvas').forEach(bind);
            });
          }
        });
        canvasObserver.observe(doc.body, { childList: true, subtree: true });
        // Фолбэк: некоторые инструменты рисуют без pointerup на canvas.
        canvasPollTimer = setInterval(() => {
          doc.querySelectorAll('canvas').forEach((c) => queueCanvasSync(c));
        }, 900);
      };

      const getStudentScoreForTask = (taskKey, displayTaskNum, studentName) => {
        const list = answersByTask[taskKey] || [];
        const sa = list.find(r => r.name === studentName);
        if (!sa) return null;
        const maxM = maxScoreByTaskNum[taskKey] || maxScoreByTaskNum[displayTaskNum] || 1;
        if (sa.answer && sa.answer.startsWith('Оценка: ')) {
          const parts = sa.answer.replace('Оценка: ', '').split(' из ');
          return { score: parseFloat(parts[0]) || 0, max: maxM, isManual: true };
        }
        return { score: sa.ok ? maxM : 0, max: maxM, isManual: false };
      };

      const patchTeacherView = (doc) => {
        if (!isTeacher) return;
        doc.querySelectorAll('.variant-score-block, .variant-score-row, .variant-score-label, .variant-score-val, .variant-score-total')
          .forEach((el) => { el.style.display = 'none'; });
        doc.querySelectorAll('#finish-btn, .exam-finish-section, .exam-finish-btn').forEach((el) => { el.style.display = 'none'; });

        // Save which criteria panels are currently open before removing them
        const openCriteriaTasks = new Set();
        doc.querySelectorAll('.lesson-criteria-section').forEach((el) => {
          if (el.closest('.lesson-extra-task')) return; // extra tasks keep their own state
          const content = el.querySelector('.lesson-criteria-content');
          if (content && content.style.display !== 'none') {
            const btn = el.querySelector('.lesson-criteria-toggle');
            if (btn && btn.dataset.task) openCriteriaTasks.add(btn.dataset.task);
          }
        });

        // Remove injected blocks only from REGULAR tasks (not from extra tasks — they manage their own)
        const notInExtra = (el) => !el.closest('.lesson-extra-task');
        doc.querySelectorAll('.lesson-teacher-answer-block').forEach((el) => { if (notInExtra(el)) el.remove(); });
        doc.querySelectorAll('.lesson-student-answers-block').forEach((el) => { if (notInExtra(el)) el.remove(); });
        doc.querySelectorAll('.lesson-attachments-teacher').forEach((el) => { if (notInExtra(el)) el.remove(); });
        doc.querySelectorAll('.lesson-criteria-section').forEach((el) => { if (notInExtra(el)) el.remove(); });
        doc.getElementById('lesson-student-totals')?.remove();

        const allTaskMeta = [];

        doc.querySelectorAll('.task').forEach((task) => {
          // Extra tasks manage their own blocks — skip them here
          if (task.classList.contains('lesson-extra-task')) return;

          task.querySelectorAll('.answer-input-row, .answer-table-wrap, .answer-actions, .answer-status, .correct-answer-display, .part2-answer-reveal').forEach((el) => el.remove());
          
          const numEl = task.querySelector('.task-number');
          const taskNum = numEl ? normalizeTaskNumber(numEl.textContent) : '';
          if (!taskNum) return;
          const taskKey = answerKeyFromDomTask(task);
          allTaskMeta.push({ key: taskKey, num: taskNum });
          
          const taskContent = task.querySelector('.task-content') || task;
          
          const correctAnswer = answerByTaskNum[taskKey] || answerByTaskNum[taskNum] || '';
          const isPart1 = correctAnswer.trim() !== '';

          const answerHtml = answerByTaskNum[taskKey] || answerByTaskNum[taskNum] || '—';
          const block = doc.createElement('div');
          block.className = 'lesson-teacher-answer-block';
          block.innerHTML =
            '<div class="lesson-teacher-answer-title">Эталонный ответ</div>' +
            '<div class="lesson-teacher-answer-value">' + answerHtml + '</div>';
          taskContent.appendChild(block);

          const studentAnswers = answersByTask[taskKey] || [];
          if (studentAnswers.length > 0) {
            const maxScore = maxScoreByTaskNum[taskKey] || maxScoreByTaskNum[taskNum] || 1;
            const studentsBlock = doc.createElement('div');
            studentsBlock.className = 'lesson-student-answers-block';
            let html = '<div class="lesson-student-answers-title">Ответы учеников</div>';
            html += '<table class="lesson-student-answers-table">';
            if (isPart1) {
              html += `<thead><tr><th>Ученик</th><th>Ответ</th><th style="width:48px;text-align:center;">Итог</th></tr></thead>`;
            } else {
              html += `<thead><tr><th>Ученик</th><th style="width:110px;text-align:center;">Балл / ${maxScore}</th></tr></thead>`;
            }
            html += '<tbody>';
            studentAnswers.forEach(sa => {
              if (isPart1) {
                const icon = sa.ok
                  ? '<span style="color:#15803d;font-weight:bold;font-size:1rem;">✓</span>'
                  : '<span style="color:#b91c1c;font-weight:bold;font-size:1rem;">✗</span>';
                html += `<tr>
                  <td><b>${safeHtml(sa.name)}</b></td>
                  <td>${safeHtml(sa.answer)}</td>
                  <td style="text-align:center;">${icon}</td>
                </tr>`;
              } else {
                const scoreData = getStudentScoreForTask(taskKey, taskNum, sa.name);
                const scoreStr = scoreData !== null
                  ? `<span style="font-weight:700;color:${scoreData.score > 0 ? '#15803d' : '#b91c1c'}">${scoreData.score}</span> / ${scoreData.max}`
                  : '—';
                html += `<tr>
                  <td><b>${safeHtml(sa.name)}</b></td>
                  <td style="text-align:center;">${scoreStr}</td>
                </tr>`;
              }
            });
            html += '</tbody></table>';
            studentsBlock.innerHTML = html;
            taskContent.appendChild(studentsBlock);
          }

          if (!isPart1) {
            const isOpen = openCriteriaTasks.has(taskNum);
            const cachedCriteria = lessonCriteriaCache[taskNum];
            const criteriaSection = doc.createElement('div');
            criteriaSection.className = 'lesson-criteria-section';
            criteriaSection.style.cssText = 'margin-top:10px;';
            criteriaSection.innerHTML = `
              <button class="lesson-criteria-toggle add-button" data-task="${taskNum}" style="width:100%;">${isOpen ? 'Скрыть критерии' : 'Критерии'}</button>
              <div class="lesson-criteria-content" style="display:${isOpen ? 'block' : 'none'};margin-top:8px;"></div>
            `;
            taskContent.appendChild(criteriaSection);
            // Restore cached criteria content if was open
            if (isOpen && cachedCriteria) {
              const content = criteriaSection.querySelector('.lesson-criteria-content');
              if (content) {
                const criteria = cachedCriteria.criteria || [];
                const maxScore = cachedCriteria.max_score || 0;
                if (criteria.length === 0) {
                  content.innerHTML = '<div style="color:#64748b;font-size:0.85rem;padding:8px 0;">Критерии не заданы</div>';
                } else {
                  let html = '<table class="lesson-student-answers-table" style="margin-top:0;">';
                  html += '<thead><tr><th>Содержание критерия</th><th style="width:60px;text-align:center;">Баллы</th></tr></thead><tbody>';
                  criteria.forEach(c => {
                    html += `<tr><td style="font-size:0.82rem;line-height:1.5;">${c.criteria_text || ''}</td><td style="text-align:center;font-weight:600;">${c.criteria_score ?? 0}</td></tr>`;
                  });
                  html += `</tbody><tfoot><tr>
                    <td style="text-align:right;font-weight:700;color:#64748b;font-size:0.78rem;padding:6px 8px;">Максимальный балл</td>
                    <td style="text-align:center;font-weight:700;padding:6px 8px;">${maxScore}</td>
                  </tr></tfoot></table>`;
                  content.innerHTML = html;
                }
              }
            }
          }
        });

        // Totals panel: sum scores per student across all tasks
        const allStudents = new Set();
        allTaskMeta.forEach(({ key }) => (answersByTask[key] || []).forEach(sa => allStudents.add(sa.name)));
        if (allStudents.size > 0) {
          const container = doc.querySelector('.main-wrapper, .exam-page, body') || doc.body;
          const totalsDiv = doc.createElement('div');
          totalsDiv.id = 'lesson-student-totals';
          let totalMax = 0;
          allTaskMeta.forEach(({ num }) => { totalMax += (maxScoreByTaskNum[num] || 1); });
          let html = '<div class="lesson-student-answers-title" style="margin-bottom:8px;">Итоговые баллы учеников</div>';
          html += '<table class="lesson-student-answers-table">';
          html += `<thead><tr><th>Ученик</th><th style="width:120px;text-align:center;">Итого / ${totalMax}</th></tr></thead><tbody>`;
          allStudents.forEach(name => {
            let total = 0;
            allTaskMeta.forEach(({ key, num }) => {
              const sd = getStudentScoreForTask(key, num, name);
              if (sd !== null) total += sd.score;
            });
            html += `<tr>
              <td><b>${safeHtml(name)}</b></td>
              <td style="text-align:center;"><span style="font-weight:700;font-size:1rem;color:${total > 0 ? '#15803d' : '#64748b'}">${total}</span> / ${totalMax}</td>
            </tr>`;
          });
          html += '</tbody></table>';
          totalsDiv.innerHTML = html;
          totalsDiv.className = 'lesson-student-answers-block';
          totalsDiv.style.cssText = 'margin:24px 0 16px;';
          container.appendChild(totalsDiv);
        }

        // Render extra tasks added by teacher
        renderExtraTasks(doc);

        // Batch MathJax typeset for all newly injected lesson blocks
        try {
          const iframeWin = frame.contentWindow;
          if (iframeWin?.MathJax?.typesetPromise) {
            const blocks = Array.from(doc.querySelectorAll(
              '.lesson-teacher-answer-block, .lesson-student-answers-block, .lesson-criteria-content, #lesson-student-totals'
            ));
            if (blocks.length) iframeWin.MathJax.typesetPromise(blocks);
          }
        } catch (_) {}
      };

      const setupTeacher = async () => {
        if (!isTeacher || !level || !subject || !variantId) return;
        try {
          const res = await fetch(`/api/${level}/${subject}/variant/${variantId}/`, { credentials: 'include' });
          const data = await res.json();
          if (res.ok && data && Array.isArray(data.tasks)) {
            answerByTaskNum = {};
            maxScoreByTaskNum = {};
            taskListIdByNum = {};
            data.tasks.forEach((t) => {
              const n = normalizeTaskNumber(t.number);
              if (n) {
                answerByTaskNum[n] = String(t.answer || '');
                maxScoreByTaskNum[n] = t.max_score || 1;
                if (t.task_list_id) taskListIdByNum[n] = t.task_list_id;
              }
              if (t.id) {
                const tk = 't' + t.id;
                answerByTaskNum[tk] = String(t.answer || '');
                maxScoreByTaskNum[tk] = t.max_score || 1;
                if (t.task_list_id) taskListIdByNum[tk] = t.task_list_id;
              }
            });
          }
        } catch (_) {}
        const d = getDoc();
        if (d) {
          withTeacherMutationsPaused(d, () => {
            patchTeacherView(d);
            renderLessonAttachments(d);
            removeLessonResultsPanel(d);
            if (extraTasks.length) renderExtraTasks(d);
          });
          
          if (!d._lessonScoreListenerAdded) {
            d._lessonScoreListenerAdded = true;
            d.addEventListener('change', (e) => {
              if (e.target && e.target.classList.contains('lesson-score-input')) {
                const student = e.target.dataset.student;
                const taskNum = e.target.dataset.task;
                const taskIdRaw = e.target.dataset.taskId;
                const score = e.target.value;
                const maxScore = maxScoreByTaskNum[taskNum] || 1;
                if (score !== '') {
                  const pl = {
                    type: 'student_answer',
                    task_number: taskNum,
                    name: student,
                    answer: 'Оценка: ' + score + ' из ' + maxScore
                  };
                  if (taskIdRaw && String(taskIdRaw).trim()) pl.task_id = String(taskIdRaw).trim();
                  sendWs(pl);
                }
              }
            });

            d.addEventListener('click', async (e) => {
              const btn = e.target.closest('.lesson-criteria-toggle');
              if (!btn) return;
              e.stopPropagation();
              const taskNum = btn.dataset.task;
              const section = btn.closest('.lesson-criteria-section');
              const content = section?.querySelector('.lesson-criteria-content');
              if (!content) return;
              const isOpen = content.style.display !== 'none';
              content.style.display = isOpen ? 'none' : 'block';
              btn.textContent = isOpen ? 'Критерии' : 'Скрыть критерии';
              if (!isOpen) {
                const renderCriteriaContent = (cdata) => {
                  const criteria = cdata.criteria || [];
                  const maxScore = cdata.max_score || 0;
                  if (criteria.length === 0) {
                    content.innerHTML = '<div style="color:#64748b;font-size:0.85rem;padding:8px 0;">Критерии не заданы</div>';
                    return;
                  }
                  let html = '<table class="lesson-student-answers-table" style="margin-top:0;">';
                  html += '<thead><tr><th>Содержание критерия</th><th style="width:60px;text-align:center;">Баллы</th></tr></thead><tbody>';
                  criteria.forEach(c => {
                    html += `<tr><td style="font-size:0.82rem;line-height:1.5;">${c.criteria_text || ''}</td><td style="text-align:center;font-weight:600;">${c.criteria_score ?? 0}</td></tr>`;
                  });
                  html += `</tbody><tfoot><tr>
                    <td style="text-align:right;font-weight:700;color:#64748b;font-size:0.78rem;padding:6px 8px;">Максимальный балл</td>
                    <td style="text-align:center;font-weight:700;padding:6px 8px;">${maxScore}</td>
                  </tr></tfoot></table>`;
                  content.innerHTML = html;
                  try {
                    const iframeWin = frame.contentWindow;
                    if (iframeWin?.MathJax?.typesetPromise) iframeWin.MathJax.typesetPromise([content]);
                  } catch (_) {}
                };
                if (lessonCriteriaCache[taskNum]) {
                  renderCriteriaContent(lessonCriteriaCache[taskNum]);
                } else {
                  content.innerHTML = '<div style="color:#64748b;font-size:0.85rem;padding:8px 0;">Загрузка…</div>';
                  try {
                    const params = new URLSearchParams();
                    if (taskListIdByNum[taskNum]) params.set('task_list_id', String(taskListIdByNum[taskNum]));
                    else params.set('task_number', taskNum);
                    const res = await fetch(`/api/${level}/${subject}/criteria/?${params.toString()}`, { credentials: 'include' });
                    const cdata = await res.json();
                    lessonCriteriaCache[taskNum] = cdata;
                    renderCriteriaContent(cdata);
                  } catch (_) {
                    content.innerHTML = '<div style="color:#ef4444;font-size:0.85rem;padding:8px 0;">Не удалось загрузить критерии</div>';
                  }
                }
              }
            });
          }
        }
      };

      const setupCursorBroadcast = () => {
        // В режиме ДЗ не отправляем курсор ученика (не должен сохраняться/синхронизироваться).
        if (!isTeacher && isHomeworkSession) return;
        frame.addEventListener('load', () => {
          const doc = getDoc();
          if (!doc) return;
          // Reset stored extra task element refs (from old document after reload)
          _extraTaskSections.clear();
          _extraTaskDivider = null;
          if (_extraTaskReinsertObserver) { _extraTaskReinsertObserver.disconnect(); _extraTaskReinsertObserver = null; }
          let lastCursorSentAt = 0;
          const sendCursor = (x, y) => {
            const now = Date.now();
            if (now - lastCursorSentAt < 40) return;
            lastCursorSentAt = now;
            const metrics = getDocMetrics(doc);
            const px = Number(x) || 0;
            const py = Number(y) || 0;
            const absX = metrics.scrollX + px;
            const absY = metrics.scrollY + py;
            const norm = cursorNormFromClient(doc, px, py);
            const payload = {
              type: 'cursor_move',
              name: me,
              role: participants[me] || (isTeacher ? 'teacher' : 'student'),
              x: px,
              y: py,
              vx: px / metrics.viewportW,
              vy: py / metrics.viewportH,
              rx: absX / metrics.contentW,
              ry: absY / metrics.contentH,
            };
            if (norm) {
              payload.nx = norm.nx;
              payload.ny = norm.ny;
            }
            sendWs(payload);
          };
          const onScrollOrResize = () => {
            scheduleCursorRedraw();
            if (typeof WbState !== 'undefined') WbState.emit();
            if (typeof wbTextInput !== 'undefined' && wbTextInput.style.display === 'block') {
              wbTextInput.blur(); // Commit text on scroll
            }
          };
          doc.addEventListener('scroll', onScrollOrResize, { passive: true, capture: true });
          const win = doc.defaultView;
          if (win) {
            win.addEventListener('scroll', onScrollOrResize, { passive: true });
            win.addEventListener('resize', onScrollOrResize, { passive: true });
          }
          const bindCursorScrollTargets = () => {
            const w = getLessonMainWrapper(doc);
            if (w && w.dataset.lessonCursorScrollBound !== '1') {
              w.dataset.lessonCursorScrollBound = '1';
              w.addEventListener('scroll', onScrollOrResize, { passive: true });
            }
            const shell = doc.querySelector('.app-shell-content');
            if (shell && shell.dataset.lessonCursorScrollBound !== '1') {
              shell.dataset.lessonCursorScrollBound = '1';
              shell.addEventListener('scroll', onScrollOrResize, { passive: true });
            }
          };
          bindCursorScrollTargets();
          const mo = new MutationObserver(() => bindCursorScrollTargets());
          if (doc.body) mo.observe(doc.body, { childList: true, subtree: true });
          doc.addEventListener('mousemove', (e) => sendCursor(e.clientX, e.clientY), { passive: true });
          doc.addEventListener('touchmove', (e) => {
            const t = e.touches && e.touches[0];
            if (!t) return;
            sendCursor(t.clientX, t.clientY);
          }, { passive: true });
        });
      };

      const setupStudent = () => {
        if (isTeacher) return;
        frame.addEventListener('load', () => {
          const doc = getDoc();
          if (!doc) return;
          const lessonStudentStartedAt = Date.now();
          const addElapsedToPayload = (pl) => {
            if (!pl || typeof pl !== 'object') return;
            const sec = Math.max(0, Math.round((Date.now() - lessonStudentStartedAt) / 1000));
            pl.elapsed_seconds = sec;
          };

          const lockCheckButton = (task) => {
            if (!task) return;
            task.querySelectorAll('.answer-input, .answer-table-input').forEach((input) => {
              input.disabled = true;
              input.style.opacity = '0.8';
              input.style.cursor = 'not-allowed';
            });
            const btns = task.querySelectorAll('button');
            btns.forEach((btn) => {
              if (!String(btn.textContent || '').toLowerCase().includes('проверить')) return;
              btn.disabled = true;
              btn.style.opacity = '0.6';
              btn.style.cursor = 'not-allowed';
              if (!String(btn.textContent || '').includes('Отправлено')) {
                btn.textContent = 'Отправлено';
              }
            });
          };

          const lockAlreadySubmittedTasks = () => {
            Object.keys(submittedTaskNumbers).forEach((taskKey) => {
              const task = [...doc.querySelectorAll('.task')].find((el) => answerKeyFromDomTask(el) === taskKey);
              if (task) lockCheckButton(task);
            });
          };
          const readTaskAnswer = (task) => {
            const tableInputs = [...task.querySelectorAll('.answer-table-input')];
            if (tableInputs.length) return tableInputs.map((i) => i.value || '').join(' ').trim();
            const input = task.querySelector('.answer-input');
            return input ? String(input.value || '').trim() : '';
          };
          doc.addEventListener('click', (e) => {
            const btn = e.target && e.target.closest ? e.target.closest('button') : null;
            if (!btn) return;
            if (!String(btn.textContent || '').toLowerCase().includes('проверить')) return;
            const task = btn.closest('.task');
            if (!task) return;
            const numEl = task.querySelector('.task-number');
            if (!numEl) return;
            const taskNum = normalizeTaskNumber(numEl.textContent);
            const taskKey = answerKeyFromDomTask(task);
            if (submittedTaskNumbers[taskKey]) return;
            const taskIdAttr = String(task.getAttribute('data-task-id') || '').trim();
            const pl = {
              type: 'student_answer',
              task_number: taskNum,
              answer: readTaskAnswer(task),
