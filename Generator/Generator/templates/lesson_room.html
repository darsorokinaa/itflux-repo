              name: participantName || 'Ученик'
            };
            addElapsedToPayload(pl);
            if (taskIdAttr) pl.task_id = taskIdAttr;
            const sent = sendWs(pl);
            if (!sent) return;
            submittedTaskNumbers[taskKey] = true;
            lockCheckButton(task);
          }, true);

          const publishTaskAnswer = (task) => {
            if (!task) return;
            const numEl = task.querySelector('.task-number');
            if (!numEl) return;
            const taskNum = normalizeTaskNumber(numEl.textContent);
            if (!taskNum) return;
            const taskKey = answerKeyFromDomTask(task);
            if (submittedTaskNumbers[taskKey]) return;
            const taskIdAttr = String(task.getAttribute('data-task-id') || '').trim();
            const pl = {
              type: 'student_answer',
              task_number: taskNum,
              answer: readTaskAnswer(task),
              name: participantName || 'Ученик',
            };
            addElapsedToPayload(pl);
            if (taskIdAttr) pl.task_id = taskIdAttr;
            const sent = sendWs(pl);
            if (!sent) return;
            submittedTaskNumbers[taskKey] = true;
            lockCheckButton(task);
          };

          doc.addEventListener('change', (e) => {
            const t = e.target;
            if (!(t instanceof Element)) return;
            if (!t.matches('.answer-input, .answer-table-input')) return;
            publishTaskAnswer(t.closest('.task'));
          }, true);
          doc.addEventListener('blur', (e) => {
            const t = e.target;
            if (!(t instanceof Element)) return;
            if (!t.matches('.answer-input, .answer-table-input')) return;
            publishTaskAnswer(t.closest('.task'));
          }, true);

          // React может перерисовать задачу и вернуть кнопку — повторно блокируем.
          const submitObs = new MutationObserver(() => lockAlreadySubmittedTasks());
          submitObs.observe(doc.body, { childList: true, subtree: true });
          lockAlreadySubmittedTasks();
          // Render any extra tasks already received before iframe loaded.
          // Small delay so React finishes its initial mount first.
          // Also reset stored element references (they're from the old document after reload).
          if (extraTasks.length) setTimeout(() => {
            _extraTaskSections.clear();
            _extraTaskDivider = null;
            if (_extraTaskReinsertObserver) { _extraTaskReinsertObserver.disconnect(); _extraTaskReinsertObserver = null; }
            renderExtraTasks(doc);
          }, 300);
        });
      };

      ws.onmessage = (event) => {
        let msg = {};
        try { msg = JSON.parse(event.data || '{}'); } catch (_) { return; }

        if (msg.type === 'lesson_ended') {
          if (isTeacher) {
            showLessonStatusToast('Работы сохранены. Показываю результаты учеников.');
            openFinishModal();
          } else {
            const btn = document.getElementById('lesson-student-results-top-btn');
            if (btn) btn.style.display = 'inline-flex';
            showLessonStatusToast('Работа проверена. Нажмите «Результаты».');
          }
          return;
        }

        // Whiteboard handlers
        if (msg.type === 'wb_stroke_add') {
          WbState.strokes.push(msg.stroke);
          if (WbState.strokes.length > 1000) WbState.strokes.splice(0, 100);
          WbState.emit();
          return;
        }
        if (msg.type === 'wb_stroke_active') {
          WbState.activeStroke = msg.stroke || null;
          WbState.emit();
          return;
        }
        if (msg.type === 'wb_strokes_erase') {
          const idSet = new Set(msg.ids);
          WbState.strokes = WbState.strokes.filter(s => !idSet.has(s.id));
          WbState.emit();
          return;
        }
        if (msg.type === 'wb_clear_all') {
          WbState.strokes = [];
          WbState.activeStroke = null;
          WbState.emit();
          return;
        }
        if (msg.type === 'wb_undo') {
          for (let i = WbState.strokes.length - 1; i >= 0; i--) {
            if (WbState.strokes[i].author === msg.author && (!msg.strokeId || WbState.strokes[i].id === msg.strokeId)) {
              WbState.strokes.splice(i, 1);
              WbState.emit();
              break;
            }
          }
          return;
        }
        if (msg.type === 'wb_init') {
          if (msg.to === me || !msg.to) {
            WbState.strokes = msg.strokes;
            WbState.emit();
          }
          return;
        }

        if (msg.type === 'join') {
          const n = String(msg.name || '').trim();
          if (n) participants[n] = String(msg.role || 'student');
          const doc = getDoc();
          if (doc) {
            renderParticipants();
            renderCursors();
          }
          
          if (isTeacher && WbState.strokes.length > 0) {
            sendWs({ type: 'wb_init', strokes: WbState.strokes, to: msg.name });
          }
          if (isTeacher && extraTasks.length > 0) {
            extraTasks.forEach(task => sendWs({ type: 'lesson_extra_task', task }));
          }
          if (isTeacher) fetchTeacherResults();
          return;
        }
        if (msg.type === 'lesson_extra_task') {
          const task = msg.task;
          if (task && task.id && !extraTasks.find(t => t.id === task.id)) {
            extraTasks.push(task);
            const doc = getDoc();
            if (doc) renderExtraTasks(doc);
          }
          return;
        }
        if (msg.type === 'lesson_extra_answer' && isTeacher) {
          const taskKey = answerKeyFromStoredTaskNumber(String(msg.taskNum || ''));
          const name = String(msg.name || '').trim();
          if (!taskKey || !name) return;
          const list = answersByTask[taskKey] || [];
          const entry = { name, answer: String(msg.answer || ''), ok: !!msg.ok };
          const idx = list.findIndex(r => r.name === name);
          if (idx >= 0) list[idx] = entry;
          else { list.push(entry); answersByTask[taskKey] = list; }
          const doc = getDoc();
          if (doc) renderExtraTasks(doc);
          return;
        }
        if (msg.type === 'leave') {
          const n = String(msg.name || '').trim();
          if (n) {
            delete participants[n];
            delete cursors[n];
          }
          const doc = getDoc();
          if (doc) {
            renderParticipants();
            renderCursors();
          }
          
          if (isTeacher && WbState.strokes.length > 0) {
            sendWs({ type: 'wb_init', strokes: WbState.strokes, to: msg.name });
          }
          if (isTeacher) fetchTeacherResults();
          return;
        }
        if (msg.type === 'cursor_move') {
          const n = String(msg.name || '').trim();
          if (!n) return;
          cursors[n] = {
            x: toFiniteOrNull(msg.x),
            y: toFiniteOrNull(msg.y),
            vx: toFiniteOrNull(msg.vx),
            vy: toFiniteOrNull(msg.vy),
            rx: toFiniteOrNull(msg.rx),
            ry: toFiniteOrNull(msg.ry),
            nx: toFiniteOrNull(msg.nx),
            ny: toFiniteOrNull(msg.ny),
            role: String(msg.role || ''),
          };
          scheduleCursorRedraw();
          return;
        }
        if (msg.type === 'board_sync') {
          if (String(msg.name || '') === me) return;
          const doc = getDoc();
          if (doc) {
            const cid = String(msg.canvas_id || '').trim();
            const c = cid ? doc.getElementById(cid) : null;
            if (!(c && c.dataset && c.dataset.lessonSkipRasterSync === '1')) {
              applyBoardSnapshot(doc, msg);
            }
          }
          return;
        }
        if (msg.type === 'board_event') {
          if (String(msg.from || '') === me) return;
          const w = frame.contentWindow;
          if (!w) return;
          try {
            w.postMessage({
              source: 'exam-embedded-board',
              type: msg.board_type,
              stroke_id: msg.stroke_id || '',
              object: msg.object,
              index: msg.index
            }, '*');
          } catch (_) {}
          return;
        }
        if (msg.type === 'variant') {
          const nextSrc = buildVariantSrc(
            msg.variant_url || msg.url || msg.link,
            msg.level,
            msg.subject,
            msg.variant_id || msg.variantId || msg.id
          );
          if (openVariantIfReady(nextSrc)) return;
        }
        if (msg.type === 'student_answer' && isTeacher) {
          const taskKey = (() => {
            const tid = msg.task_id != null && String(msg.task_id).trim() !== '' ? String(msg.task_id).trim() : '';
            if (tid && /^\d+$/.test(tid)) return 't' + tid;
            return answerKeyFromStoredTaskNumber(msg.task_number || msg.task || msg.number);
          })();
          if (!taskKey) return;
          const displayNum = normalizeTaskNumber(msg.task_number || msg.task || msg.number);
          const studentAnswer = String(msg.answer || '');
          const studentName = String(msg.name || 'Ученик');
          let ok = false;
          const expected = answerByTaskNum[taskKey] || answerByTaskNum[displayNum];
          if (expected != null && expected.trim() !== '') {
            ok = normalizeAnswer(studentAnswer) === normalizeAnswer(stripHtml(expected));
          }
          const list = answersByTask[taskKey] || [];
          const idx = list.findIndex((r) => r.name === studentName);
          const row = { name: studentName, answer: studentAnswer, ok };
          if (idx >= 0) list[idx] = row; else list.push(row);
          answersByTask[taskKey] = list;
          const doc = getDoc();
          if (doc) scheduleTeacherAnswerRefresh(doc);
          fetchTeacherResults();
          return;
        }
        if (msg.type === 'student_attachment' && isTeacher) {
          const taskKey = (() => {
            const tid = msg.task_id != null && String(msg.task_id).trim() !== '' ? String(msg.task_id).trim() : '';
            if (tid && /^\d+$/.test(tid)) return 't' + tid;
            return answerKeyFromStoredTaskNumber(msg.task_number || msg.task || msg.number);
          })();
          if (!taskKey || !msg.url) return;
          const row = {
            name: String(msg.name || 'Ученик').trim() || 'Ученик',
            url: String(msg.url || ''),
            filename: String(msg.filename || ''),
          };
          attachmentsByTask[taskKey] = attachmentsByTask[taskKey] || [];
          if (!attachmentsByTask[taskKey].some((x) => x.url === row.url)) attachmentsByTask[taskKey].push(row);
          const doc = getDoc();
          if (doc) {
            withTeacherMutationsPaused(doc, () => {
              patchTeacherView(doc);
              renderLessonAttachments(doc);
              removeLessonResultsPanel(doc);
            });
          }
          return;
        }
      };

      window.addEventListener('message', (ev) => {
        if (!frame || ev.source !== frame.contentWindow) return;
        const d = ev.data;
        if (d && d.source === 'exam-embedded-lesson' && d.type === 'lesson_finish_click') {
          if (isTeacher) openFinishModal();
          return;
        }
        if (!d || d.source !== 'exam-embedded-board') return;

        if (d.type === 'board_add' || d.type === 'board_remove' || d.type === 'board_clear') {
          const payload = {
            type: 'board_event',
            from: me,
            board_type: d.type,
            stroke_id: d.stroke_id || '',
            object: d.object,
            index: d.index
          };
          if (!ws || ws.readyState !== WebSocket.OPEN) {
            if (pendingBoardObjects.length < 400) pendingBoardObjects.push(payload);
            return;
          }
          sendWs(payload);
        }
      });

      frame.addEventListener('load', () => {
        const doc = getDoc();
        if (!doc) return;

        const style = doc.createElement('style');
        style.textContent = `
          .variant-btn-primary,.variant-btn-cosmos,.variant-btn-easter,.variant-btn-copy-link{display:none!important}
          .variant-hero-actions{display:none!important}
          #finish-btn,.exam-finish-section,.exam-finish-btn{display:none!important}
          .lesson-participants-title{font-size:.78rem;font-weight:700;color:#334155;margin-bottom:6px;text-align:right}
          .lesson-participants-list{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
          .lesson-participant-chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;font-size:.74rem;font-weight:600}
          #lesson-cursors-layer{position:fixed;inset:0;pointer-events:none;z-index:2147483646}
          .lesson-cursor{position:fixed;transform:translate(-2px,-2px)}
          .lesson-cursor-dot{display:block;width:9px;height:9px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(2,6,23,.35)}
          .lesson-cursor--teacher .lesson-cursor-name{background:rgba(154,52,18,.92)}
          .lesson-cursor--student .lesson-cursor-name{background:rgba(30,58,138,.88)}
          .lesson-cursor-name{display:inline-block;margin-top:2px;padding:2px 6px;border-radius:999px;background:rgba(15,23,42,.82);color:#fff;font-size:11px;line-height:1.2;white-space:nowrap}
          .task:not(.lesson-extra-task) .answer-section,.task:not(.lesson-extra-task) .answer-input-row,.task:not(.lesson-extra-task) .answer-actions,.task:not(.lesson-extra-task) .answer-status{display:${isTeacher ? 'none' : 'revert'}!important}
          .variant-score-block,.variant-score-row,.variant-score-label,.variant-score-val,.variant-score-total{display:${isTeacher ? 'none' : 'revert'}!important}
          ${!isTeacher ? `
          .correct-answer-display,.part2-answer-reveal,.task-report-error-wrap{display:none!important}
          .lesson-extra-task .extra-task-correct-answer{display:none}
          .part2-answer-criteria-buttons {display:none!important}
          ` : `
          .part2-answer-reveal {display:none!important}
          .part2-answer-criteria-buttons { display: flex; flex-direction: column; width: 100%; gap: 8px; }
          .part2-answer-criteria-buttons > .add-button { width: 100%; }
          .part2-answer-criteria-buttons > .add-button:not(.criteria-btn) { display: none !important; }
          `}
          ${isTeacher ? `
          .criteria-radio-input, .criteria-radio-check { display: none !important; }
          .criteria-radio-label { cursor: default !important; gap: 0 !important; }
          .criteria-row:hover { background: transparent !important; }
          .lesson-teacher-answer-block{margin-top:10px;padding:10px 12px;border:1px solid #bfdbfe;background:#f0f9ff;border-radius:10px}
          .lesson-teacher-answer-title{font-size:.72rem;font-weight:800;color:#1d4ed8;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
          .lesson-teacher-answer-value{font-size:.88rem;line-height:1.5;color:#0f172a;word-break:break-word}
          .lesson-student-answers-block{margin-top:10px;padding:10px 12px;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:10px}
          .lesson-student-answers-title{font-size:.72rem;font-weight:800;color:#15803d;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
          .lesson-student-answers-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.88rem}
          .lesson-student-answers-table th{padding:6px 8px;color:#15803d;border-bottom:1px solid #bbf7d0;text-align:left}
          .lesson-student-answers-table td{padding:6px 8px;color:#0f172a;border-bottom:1px solid #dcfce7;word-break:break-word}
          .lesson-student-answers-table tr:last-child td{border-bottom:none}
          .lesson-attachments-teacher{margin-top:10px;padding:10px 12px;border:1px solid #d8b4fe;background:#faf5ff;border-radius:10px}
          .lesson-attachments-title{font-size:.72rem;font-weight:800;color:#7e22ce;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
          .lesson-attachments-grid{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
          .lesson-attachment-fig{margin:0;max-width:min(200px,100%)}
          .lesson-attachment-fig img{display:block;max-width:100%;max-height:160px;object-fit:contain;border-radius:8px;border:1px solid #e9d5ff;background:#fff}
          .lesson-attachment-fig figcaption{margin-top:4px;font-size:.72rem;color:#6b21a8;word-break:break-word}
          ` : ''}
          /* Hide the Open Board button inside the iframe */
          #open-board-btn {
            display: none !important;
          }
        `;
        doc.head.appendChild(style);

        const updateZoom = () => {
          const win = frame.contentWindow;
          if (!win || !doc.body) return;
          const wrapper = document.getElementById('lesson-frame-wrapper');
          const fw = wrapper.clientWidth;
          const fh = wrapper.clientHeight;
          
          const scaleWrapper = document.getElementById('scale-wrapper');
          currentScale = 1;
          scaleWrapper.style.transform = 'none';
          scaleWrapper.style.height = '100%';
          
          if (typeof resizeWb === 'function') resizeWb();
          if (typeof WbState !== 'undefined') WbState.emit();
                                                                                              };
        updateZoom();
        window.addEventListener('resize', updateZoom);

        renderParticipants();
        ensureCursorLayer(doc);
        renderCursors();
        bindCanvasSync(doc);

        if (isTeacher) {
          void setupTeacher();
          withTeacherMutationsPaused(doc, () => {
            patchTeacherView(doc);
            renderLessonAttachments(doc);
            removeLessonResultsPanel(doc);
          });
          if (taskObserver) taskObserver.disconnect();
          taskObserver = new MutationObserver((mutations) => {
            // Skip mutations caused by teacher UI / MathJax rendering inside lesson-injected blocks
            const LESSON_SELECTORS = [
              '.criteria-panel', '.criteria-table-wrap',
              '.lesson-teacher-answer-block', '.lesson-student-answers-block',
              '.lesson-attachments-teacher', '.lesson-criteria-section',
              '#lesson-student-totals', '.lesson-solution-upload', '.lesson-solution-pending',
              '.lesson-extra-task', '.lesson-extra-divider'
            ];
            const ignorable = mutations.every((m) => {
              // Text nodes don't have .closest — use their parent
              let tgt = m.target;
              if (tgt && tgt.nodeType !== 1) tgt = tgt.parentElement;
              if (!tgt || !tgt.closest) return false;
              return LESSON_SELECTORS.some(sel => tgt.closest(sel));
            });
            if (ignorable) return;
            withTeacherMutationsPaused(doc, () => {
              patchTeacherView(doc);
              renderLessonAttachments(doc);
              removeLessonResultsPanel(doc);
            });
          });
          taskObserver.observe(doc.body, { childList: true, subtree: true });
          fetchTeacherResults();
          if (teacherResultsPollTimer) clearInterval(teacherResultsPollTimer);
          teacherResultsPollTimer = setInterval(() => fetchTeacherResults(), 3000);
        }
      });

      // ===== EXTRA TASKS =====
      let extraTasks = []; // { id, taskNum, taskTitle, text, answer, maxScore, isPart2 }

      // Stored DOM element references — preserved across re-renders to keep state intact
      const _extraTaskSections = new Map(); // taskId -> section element
      let _extraTaskDivider = null;
      let _extraTaskReinsertObserver = null;

      // Normalize answer exactly like ExamPage.jsx
      const _normAnswer = (str) => String(str ?? '')
        .normalize('NFC').replace(/[\u200B-\u200D\uFEFF\u00AD]/g, '')
        .trim().toLowerCase().replace(/\s+/g, '');

      const _htmlToText = (html, doc) => {
        if (!html) return '';
        try {
          const tmp = doc.createElement('div');
          tmp.innerHTML = html;
          return (tmp.textContent || tmp.innerText || '').trim();
        } catch (_) { return String(html).replace(/<[^>]*>/g, ''); }
      };

      const _buildStudentAnswersHtml = (taskKey, displayTaskNum, isPart2, maxScore) => {
        const studentAnswers = answersByTask[taskKey] || [];
        if (!studentAnswers.length) return '';
        let html = '<div class="lesson-student-answers-title">Ответы учеников</div>';
        html += '<table class="lesson-student-answers-table">';
        if (!isPart2) {
          html += `<thead><tr><th>Ученик</th><th>Ответ</th><th style="width:48px;text-align:center;">Итог</th></tr></thead>`;
        } else {
          html += `<thead><tr><th>Ученик</th><th style="width:110px;text-align:center;">Балл / ${maxScore}</th></tr></thead>`;
        }
        html += '<tbody>';
        studentAnswers.forEach(sa => {
          if (!isPart2) {
            const icon = sa.ok
              ? '<span style="color:#15803d;font-weight:bold;">✓</span>'
              : '<span style="color:#b91c1c;font-weight:bold;">✗</span>';
            html += `<tr><td><b>${safeHtml(sa.name)}</b></td><td>${safeHtml(sa.answer)}</td><td style="text-align:center;">${icon}</td></tr>`;
          } else {
            const sd = getStudentScoreForTask(taskKey, displayTaskNum, sa.name);
            const scoreStr = sd !== null
              ? `<span style="font-weight:700;color:${sd.score > 0 ? '#15803d' : '#b91c1c'}">${sd.score}</span> / ${sd.max}`
              : '—';
            html += `<tr><td><b>${safeHtml(sa.name)}</b></td><td style="text-align:center;">${scoreStr}</td></tr>`;
          }
        });
        return html + '</tbody></table>';
      };

      const _getPage = (doc) => doc.querySelector('.page') || doc.querySelector('.exam-page-container') || doc.body;

      const _getInsertionAnchor = (page) => page.querySelector('.exam-finish-section') || null;

      const _ensureExtraTasksInserted = (doc) => {
        if (!extraTasks.length) return;
        const page = _getPage(doc);
        if (!page) return;
        const anchor = _getInsertionAnchor(page);
        // Ensure divider
        if (!_extraTaskDivider) {
          _extraTaskDivider = doc.createElement('div');
          _extraTaskDivider.className = 'part-divider part-divider-2 lesson-extra-divider';
          _extraTaskDivider.innerHTML = '<h2>Дополнительные задания</h2><p>Задания добавлены учителем</p>';
        }
        if (!page.contains(_extraTaskDivider)) {
          anchor ? page.insertBefore(_extraTaskDivider, anchor) : page.appendChild(_extraTaskDivider);
        }
        // Ensure each section
        _extraTaskSections.forEach((section) => {
          if (!page.contains(section)) {
            anchor ? page.insertBefore(section, anchor) : page.appendChild(section);
          }
        });
      };

      /** Раньше внизу варианта в iframe показывали дублирующую кнопку «Завершить урок»; оставлена только верхняя. */
      function injectTeacherFinishStrip(doc) {
        if (!doc || !isTeacher) return;
        doc.getElementById('lesson-teacher-finish-in-frame')?.remove();
      }

      const renderExtraTasks = (doc) => {
        if (!doc) return;
        if (!extraTasks.length) {
          if (isTeacher) injectTeacherFinishStrip(doc);
          return;
        }

        // Remember which task ids already existed before this call (for MathJax)
        const _prevIds = new Set(_extraTaskSections.keys());

        // Track open criteria panels before any DOM changes
        const openExtraCriteria = new Set();
        if (isTeacher) {
          _extraTaskSections.forEach(section => {
            section.querySelectorAll('.lesson-criteria-section').forEach(el => {
              const content = el.querySelector('.lesson-criteria-content');
              const btn = el.querySelector('.lesson-criteria-toggle');
              if (content && content.style.display !== 'none' && btn?.dataset.task) {
                openExtraCriteria.add(btn.dataset.task);
              }
            });
          });
        }

        extraTasks.forEach(task => {
          const taskNum = task.taskNum || '?';
          const taskId = String(task.id || taskNum);
          const isPart2 = !!task.isPart2;
          if (task.taskListId && taskNum !== '?') taskListIdByNum[taskNum] = task.taskListId;

          // ── UPDATE existing section in-place (teacher: refresh student answers; student: skip) ──
          if (_extraTaskSections.has(taskId)) {
            if (isTeacher) {
              answerByTaskNum[taskNum] = task.answer || '';
              maxScoreByTaskNum[taskNum] = task.maxScore || 1;
              const section = _extraTaskSections.get(taskId);
              const tc = section.querySelector('.task-content') || section;
              tc.querySelector('.lesson-student-answers-block')?.remove();
              const exKey = answerKeyFromStoredTaskNumber(String(taskNum));
              const saHtml = _buildStudentAnswersHtml(exKey, String(taskNum), isPart2, task.maxScore || 1);
              if (saHtml) {
                const block = doc.createElement('div');
                block.className = 'lesson-student-answers-block';
                block.innerHTML = saHtml;
                const criteriaSection = tc.querySelector('.lesson-criteria-section');
                if (criteriaSection) tc.insertBefore(block, criteriaSection);
                else tc.appendChild(block);
              }
            }
            // student: nothing to update — state is preserved
            return;
          }

          // ── CREATE new section ──
          if (isTeacher) {
            answerByTaskNum[taskNum] = task.answer || '';
            maxScoreByTaskNum[taskNum] = task.maxScore || 1;
          }

          // ── ASIDE: task number + task id (same as regular tasks) ──
          const aside = doc.createElement('aside');
          aside.className = 'task-left';
          aside.innerHTML = `
            <div class="task-number">${safeHtml(String(taskNum))}</div>
            <div class="task-id">${safeHtml(String(task.id || ''))}</div>`;

          // ── ARTICLE content ──
          const article = doc.createElement('article');
          article.className = 'task-content';

          // Task text
          const textDiv = doc.createElement('div');
          textDiv.className = 'task-text';
          textDiv.innerHTML = task.text || '';
          article.appendChild(textDiv);

          if (isTeacher) {
            // Эталонный ответ (part 1)
            if (!isPart2 && task.answer) {
              const ansBlock = doc.createElement('div');
              ansBlock.className = 'lesson-teacher-answer-block';
              ansBlock.innerHTML = `<div class="lesson-teacher-answer-title">Эталонный ответ</div><div class="lesson-teacher-answer-value">${task.answer}</div>`;
              article.appendChild(ansBlock);
            }
            // Student answers table
            const exKey2 = answerKeyFromStoredTaskNumber(String(taskNum));
            const saHtml = _buildStudentAnswersHtml(exKey2, String(taskNum), isPart2, task.maxScore || 1);
            if (saHtml) {
              const saBlock = doc.createElement('div');
              saBlock.className = 'lesson-student-answers-block';
              saBlock.innerHTML = saHtml;
              article.appendChild(saBlock);
            }
            // Criteria (part 2)
            if (isPart2) {
              const isOpen = openExtraCriteria.has(String(taskNum));
              const crit = doc.createElement('div');
              crit.className = 'lesson-criteria-section';
              crit.style.marginTop = '10px';
              crit.innerHTML = `<button class="lesson-criteria-toggle add-button" data-task="${escAttr(String(taskNum))}" style="width:100%;">${isOpen ? 'Скрыть критерии' : 'Критерии'}</button><div class="lesson-criteria-content" style="display:${isOpen ? 'block' : 'none'};margin-top:8px;"></div>`;
              article.appendChild(crit);
            }
          } else {
            // STUDENT
            if (!isPart2) {
              // Part 1: input + Проверить
              const answerSection = doc.createElement('div');
              answerSection.className = 'answer-section';
              const row = doc.createElement('div');
              row.className = 'answer-input-row';
              row.style.cssText = 'display:flex;gap:8px;align-items:center;';

              const input = doc.createElement('input');
              input.type = 'text';
              input.className = 'answer-input extra-task-answer-input';
              input.placeholder = 'Введите ответ';
              input.style.cssText = 'flex:1;min-width:0;';
              // Store raw answer HTML as a JS property (not HTML attribute) to avoid quote issues
              input._correctRawAnswer = task.answer || '';

              const statusEl = doc.createElement('span');
              statusEl.className = 'answer-status extra-task-answer-status';

              const checkBtn = doc.createElement('button');
              checkBtn.className = 'add-button extra-task-check-btn';
              checkBtn.style.cssText = 'padding:0.6rem 1rem;font-size:0.85rem;white-space:nowrap;flex-shrink:0;';
              checkBtn.textContent = 'Проверить';

              row.appendChild(input);
              row.appendChild(statusEl);
              row.appendChild(checkBtn);
              answerSection.appendChild(row);

              // Correct answer reveal — empty initially, filled on wrong answer
              const correctReveal = doc.createElement('div');
              correctReveal.className = 'correct-answer-display extra-task-correct-answer';
              correctReveal.style.cssText = 'display:none;margin-top:6px;';
              correctReveal.innerHTML = '<span class="correct-answer-label">Правильный ответ: </span><span class="correct-answer-content"></span>';
              answerSection.appendChild(correctReveal);

              article.appendChild(answerSection);

              // Wire check button
              checkBtn.addEventListener('click', () => {
                const correctRaw = input._correctRawAnswer || '';
                const userVal = _normAnswer(input.value);
                const correctVal = _normAnswer(_htmlToText(correctRaw, doc));
                const isCorrect = userVal === correctVal;
                input.classList.toggle('correct', isCorrect);
                input.classList.toggle('incorrect', !isCorrect);
                input.disabled = true;
                statusEl.textContent = isCorrect ? '✓' : '✗';
                statusEl.classList.toggle('correct', isCorrect);
                statusEl.classList.toggle('incorrect', !isCorrect);
                checkBtn.style.setProperty('display', 'none', 'important');
                if (!isCorrect) {
                  const contentSpan = correctReveal.querySelector('.correct-answer-content');
                  if (contentSpan) contentSpan.textContent = _htmlToText(correctRaw, doc);
                  correctReveal.style.setProperty('display', 'block', 'important');
                }
                const taskNumForWs = String(taskNum);
                if (taskNumForWs) sendWs({ type: 'lesson_extra_answer', taskNum: taskNumForWs, name: me, answer: input.value, ok: isCorrect });
              });
            } else {
              // Part 2: textarea
              const answerSection = doc.createElement('div');
              answerSection.className = 'answer-section';
              const row = doc.createElement('div');
              row.className = 'answer-input-row';
              const ta = doc.createElement('textarea');
              ta.className = 'answer-input';
              ta.placeholder = 'Введите ответ...';
              ta.style.cssText = 'width:100%;min-height:80px;resize:vertical;box-sizing:border-box;';
              row.appendChild(ta);
              answerSection.appendChild(row);
              article.appendChild(answerSection);
            }
          }

          // Error report button (same as regular tasks — hidden by teacher CSS)
          const reportWrap = doc.createElement('div');
          reportWrap.className = 'task-report-error-wrap';
          article.appendChild(reportWrap);

          const section = doc.createElement('section');
          section.className = 'task lesson-extra-task';
          section.dataset.taskNum = String(taskNum);
          section.dataset.taskId = taskId;
          section.appendChild(aside);
          section.appendChild(article);

          _extraTaskSections.set(taskId, section);
        });

        // Insert all sections (new + re-insert if React removed them)
        _ensureExtraTasksInserted(doc);

        // Re-insertion observer (student side) — if React removes nodes, put them back
        if (!_extraTaskReinsertObserver) {
          const page = _getPage(doc);
          if (page) {
            _extraTaskReinsertObserver = new MutationObserver(() => {
              _ensureExtraTasksInserted(doc);
            });
            _extraTaskReinsertObserver.observe(page, { childList: true });
          }
        }

        // MathJax on newly created sections only
        try {
          const iframeWin = frame.contentWindow;
          if (iframeWin?.MathJax?.typesetPromise) {
            const newSections = extraTasks
              .map(t => _extraTaskSections.get(String(t.id || t.taskNum)))
              .filter(el => el && !_prevIds.has(String(el.dataset.taskId)));
            if (newSections.length) iframeWin.MathJax.typesetPromise(newSections);
          }
        } catch (_) {}
        if (isTeacher) injectTeacherFinishStrip(doc);
      };

      // ===== ADD TASK MODAL =====
      const addTaskModalEl = document.getElementById('lesson-add-task-modal');
      const addTaskBtnEl = document.getElementById('lesson-add-task-btn');
      if (isTeacher && addTaskBtnEl) addTaskBtnEl.style.display = 'flex';

      let modalTaskItems = null; // built from /tasks/: singles + structured groups (not flattened)
      let modalSelectedItem = null; // one of modalTaskItems
      let modalBankPage = 1;
      let modalBankTotal = 0;

      const openAddTaskModal = async () => {
        if (!addTaskModalEl) return;
        addTaskModalEl.style.display = 'block';
        addTaskModalEl.style.alignItems = 'flex-start';
        addTaskModalEl.style.justifyContent = 'center';
        document.body.style.overflow = 'hidden';
        if (!modalTaskItems && level && subject) {
          const slotsEl = document.getElementById('lesson-task-slots');
          if (slotsEl) slotsEl.innerHTML = '<div class="lesson-modal-placeholder">Загрузка…</div>';
          try {
            const res = await fetch(`/api/${level}/${subject}/tasks/`, { credentials: 'include' });
            const data = await res.json();
            modalTaskItems = [];
            (data.tasks || []).forEach(t => {
              if (t.type === 'single') {
                modalTaskItems.push({
                  kind: 'single',
                  key: `task_${t.id}`,
                  taskListId: t.id,
                  num: t.task_number,
                  title: t.task_title,
                });
              } else if (t.type === 'group' || t.type === 'linked_group') {
                const numsRaw = (t.task_numbers && t.task_numbers.length)
                  ? [...t.task_numbers]
                  : (t.tasks || []).map(x => x.task_number).filter(n => n != null && n !== '');
                const numsSorted = [...new Set(numsRaw.map(n => Number(n)))].sort((a, b) => a - b);
                const linkedKey = t.type === 'linked_group'
                  ? String(t.linked_key || numsSorted.join('_'))
                  : numsSorted.join('_');
                const label = numsSorted.length
                  ? (numsSorted.length === 1 ? `Группа · задание ${numsSorted[0]}` : `Группа ${numsSorted[0]}–${numsSorted[numsSorted.length - 1]}`)
                  : 'Группа заданий';
                modalTaskItems.push({
                  kind: 'group',
                  groupType: t.type,
                  key: t.type === 'linked_group' ? `linked_${t.linked_key}` : `group_${t.group_id}`,
                  linkedKey,
                  taskNumbers: numsSorted,
                  label,
                  tasks: t.tasks || [],
                  subtopics: t.subtopics || [],
                });
              }
            });
            if (modalTaskItems.length) {
              modalSelectedItem = modalTaskItems[0];
              modalSelectedSubtopic = null;
              modalBankPage = 1;
              renderSlots();
              if (modalSelectedItem.kind === 'single') {
                loadSubtopics(modalSelectedItem.taskListId);
                loadTaskBank(modalSelectedItem.taskListId, 1);
              } else {
                loadSubtopicsForGroup(modalSelectedItem);
                loadGroupBank(modalSelectedItem, 1);
              }
            } else {
              renderSlots();
            }
          } catch (_) {
            const slotsEl2 = document.getElementById('lesson-task-slots');
            if (slotsEl2) slotsEl2.innerHTML = '<div class="lesson-modal-placeholder lesson-modal-placeholder--error">Ошибка загрузки</div>';
          }
        }
      };

      let modalSelectedSubtopic = null; // null = all subtopics

      const isModalItemSelected = (item) => modalSelectedItem && modalSelectedItem.key === item.key;

      const renderSlots = () => {
        const slotsEl = document.getElementById('lesson-task-slots');
        if (!slotsEl || !modalTaskItems) return;
        slotsEl.innerHTML = '';
        const hdr = document.createElement('div');
        hdr.className = 'lesson-slot-header';
        hdr.textContent = 'Задание №';
        slotsEl.appendChild(hdr);
        modalTaskItems.forEach(item => {
          if (item.kind === 'single') {
            const btn = document.createElement('button');
            const sel = isModalItemSelected(item);
            btn.className = `lesson-slot-item${sel ? ' is-active' : ''}`;
            btn.textContent = `${item.num}. ${item.title}`;
            btn.onclick = () => {
              modalSelectedItem = item;
              modalSelectedSubtopic = null;
              modalBankPage = 1;
              renderSlots();
              loadSubtopics(item.taskListId);
              loadTaskBank(item.taskListId, 1);
            };
            slotsEl.appendChild(btn);
          } else {
            const wrap = document.createElement('div');
            wrap.className = 'lesson-slot-group';
            const hdrG = document.createElement('div');
            hdrG.textContent = item.groupType === 'linked_group' ? 'Связанная группа' : 'Группа';
            hdrG.className = 'lesson-slot-group-title';
            const btn = document.createElement('button');
            const selG = isModalItemSelected(item);
            btn.className = `lesson-slot-item${selG ? ' is-active' : ''}`;
            const numsStr = item.taskNumbers.join(', ');
            const titlesPreview = (item.tasks || []).map(x => x.task_title).filter(Boolean).join(' · ');
            btn.innerHTML = `<div class="lesson-slot-group-label">${safeHtml(item.label)}</div><div class="lesson-slot-group-meta">Номера: ${safeHtml(numsStr)}</div>${titlesPreview ? `<div class="lesson-slot-group-preview">${safeHtml(titlesPreview.length > 180 ? titlesPreview.slice(0, 180) + '…' : titlesPreview)}</div>` : ''}`;
            btn.onclick = () => {
              modalSelectedItem = item;
              modalSelectedSubtopic = null;
              modalBankPage = 1;
              renderSlots();
              loadSubtopicsForGroup(item);
              loadGroupBank(item, 1);
            };
            wrap.appendChild(hdrG);
            wrap.appendChild(btn);
            slotsEl.appendChild(wrap);
          }
        });
      };

      const loadSubtopics = async (taskListId) => {
        const bar = document.getElementById('lesson-subtopic-bar');
        if (!bar) return;
        bar.style.display = 'none';
        try {
          const res2 = await fetch(`/api/${level}/${subject}/subtopics/`, { credentials: 'include' });
          const data2 = await res2.json();
          const entry = (data2.subtopics_by_task || []).find(e => String(e.task_list_id) === String(taskListId));
          const subtopics = entry ? (entry.subtopics || []) : [];
          if (!subtopics.length) return;
          bar.innerHTML = '<span class="lesson-subtopic-label">Подтема:</span>';
          const allChip = document.createElement('button');
          allChip.textContent = 'Все';
          allChip.dataset.stid = '';
          allChip.className = `lesson-subtopic-chip${!modalSelectedSubtopic ? ' is-active' : ''}`;
          allChip.onclick = () => { modalSelectedSubtopic = null; loadSubtopicChips(subtopics); loadTaskBank(taskListId); };
          bar.appendChild(allChip);
          subtopics.forEach(st => {
            const chip = document.createElement('button');
            chip.textContent = st.title;
            chip.dataset.stid = st.id != null ? String(st.id) : '';
            chip.className = `lesson-subtopic-chip${modalSelectedSubtopic === st.id ? ' is-active' : ''}`;
            chip.onclick = () => { modalSelectedSubtopic = st.id; loadSubtopicChips(subtopics); loadTaskBank(taskListId, 1); };
            bar.appendChild(chip);
          });
          bar.style.display = 'block';
        } catch (_) {}
      };

      const loadSubtopicsForGroup = (item) => {
        const bar = document.getElementById('lesson-subtopic-bar');
        if (!bar) return;
        bar.style.display = 'none';
        bar.innerHTML = '';
        const subtopics = item.subtopics || [];
        if (!subtopics.length) return;
        bar.innerHTML = '<span class="lesson-subtopic-label">Подтема:</span>';
        const allChip = document.createElement('button');
        allChip.textContent = 'Все';
        allChip.dataset.stid = '';
        allChip.className = `lesson-subtopic-chip${modalSelectedSubtopic == null ? ' is-active' : ''}`;
        allChip.onclick = () => { modalSelectedSubtopic = null; loadSubtopicChips(subtopics); loadGroupBank(item, 1); };
        bar.appendChild(allChip);
        subtopics.forEach(st => {
          const chip = document.createElement('button');
          chip.textContent = st.title;
          chip.dataset.stid = st.id != null ? String(st.id) : '';
          const active = modalSelectedSubtopic === st.id;
          chip.className = `lesson-subtopic-chip${active ? ' is-active' : ''}`;
          chip.onclick = () => { modalSelectedSubtopic = st.id; loadSubtopicChips(subtopics); loadGroupBank(item, 1); };
          bar.appendChild(chip);
        });
        bar.style.display = 'block';
      };

      const loadSubtopicChips = (subtopics) => {
        const bar = document.getElementById('lesson-subtopic-bar');
        if (!bar) return;
        bar.querySelectorAll('button[data-stid]').forEach(chip => {
          let active = false;
          if (chip.dataset.stid === '') active = modalSelectedSubtopic == null;
          else active = Number(chip.dataset.stid) === Number(modalSelectedSubtopic);
          chip.classList.toggle('is-active', active);
        });
      };

      const loadTaskBank = async (taskListId, page = 1) => {
        const bankEl = document.getElementById('lesson-task-bank');
        if (!bankEl) return;
        bankEl.innerHTML = '<div class="lesson-modal-placeholder">Загрузка задач…</div>';
        try {
          let url = `/api/${level}/${subject}/task-bank/?task_list_id=${taskListId}&page=${page}&per_page=10`;
          if (modalSelectedSubtopic) url += `&subtopic_id=${modalSelectedSubtopic}`;
          const res = await fetch(url, { credentials: 'include' });
          const data = await res.json();
          modalBankTotal = data.total || 0;
          const tasks = data.tasks || [];
          if (!tasks.length) {
            bankEl.innerHTML = '<div class="lesson-modal-placeholder">Задачи не найдены</div>';
            return;
          }
          bankEl.innerHTML = '';
          tasks.forEach(t => {
            const card = document.createElement('div');
            card.className = 'lesson-bank-card';

            // Top row: subtopic chip + add button
            const topRow = document.createElement('div');
            topRow.className = 'lesson-bank-card-header';

            const metaLeft = document.createElement('div');
            metaLeft.className = 'lesson-bank-meta';

            // Task number badge
            const numBadge = document.createElement('span');
            numBadge.className = 'lesson-bank-badge lesson-bank-badge--num';
            numBadge.textContent = `Задание ${t.task_number}`;
            metaLeft.appendChild(numBadge);

            // Part badge
            if (t.part_title) {
              const partBadge = document.createElement('span');
              const isPt2 = (t.max_score || 1) > 1 || (t.part_id != null && t.part_id !== 1);
              partBadge.className = `lesson-bank-badge ${isPt2 ? 'lesson-bank-badge--part2' : 'lesson-bank-badge--part1'}`;
              partBadge.textContent = t.part_title + (t.max_score > 1 ? ` · ${t.max_score} б.` : '');
              metaLeft.appendChild(partBadge);
            }

            // Subtopic chip
            if (t.subtopic) {
              const stChip = document.createElement('span');
              stChip.className = 'lesson-bank-badge lesson-bank-badge--subtopic';
              stChip.title = t.subtopic;
              stChip.textContent = t.subtopic;
              metaLeft.appendChild(stChip);
            }

            const addBtn = document.createElement('button');
            addBtn.dataset.tid = t.id;
            addBtn.className = 'lesson-modal-add-btn lesson-ui-btn lesson-ui-btn--primary';
            addBtn.textContent = 'Добавить';
            addBtn.onclick = () => addExtraTask(t);

            topRow.appendChild(metaLeft);
            topRow.appendChild(addBtn);

            // Task text
            const textEl = document.createElement('div');
            textEl.className = 'lesson-bank-task-text';
            textEl.innerHTML = t.text || '';

            card.appendChild(topRow);
            card.appendChild(textEl);
            bankEl.appendChild(card);
          });

          // Typeset MathJax in modal
          if (window.MathJax?.typesetPromise) {
            window.MathJax.typesetPromise([bankEl]).catch(() => {});
          }

          // Pagination
          const totalPages = Math.ceil(modalBankTotal / 10);
          if (totalPages > 1) {
            const pag = document.createElement('div');
            pag.className = 'lesson-bank-pagination';
            for (let p = 1; p <= totalPages; p++) {
              const pb = document.createElement('button');
              pb.textContent = p;
              pb.className = `lesson-page-btn${p === page ? ' is-active' : ''}`;
              pb.onclick = () => loadTaskBank(taskListId, p);
              pag.appendChild(pb);
            }
            bankEl.appendChild(pag);
          }
        } catch (_) {
          const bankEl2 = document.getElementById('lesson-task-bank');
          if (bankEl2) bankEl2.innerHTML = '<div class="lesson-modal-placeholder lesson-modal-placeholder--error">Ошибка загрузки задач</div>';
        }
      };

      /** Полные экземпляры групп (как в «Составить вариант»): карточка = вся группа, внутри — все номера подряд. */
      const loadGroupBank = async (item, page = 1) => {
        const bankEl = document.getElementById('lesson-task-bank');
        if (!bankEl || !item || item.kind !== 'group') return;
        bankEl.innerHTML = '<div class="lesson-modal-placeholder">Загрузка групп…</div>';
        try {
          let url = `/api/${level}/${subject}/group-instances/?linked_key=${encodeURIComponent(item.linkedKey)}&page=${page}&per_page=10`;
          if (modalSelectedSubtopic != null && modalSelectedSubtopic !== '') url += `&subtopic_id=${modalSelectedSubtopic}`;
          const res = await fetch(url, { credentials: 'include' });
          const data = await res.json();
          modalBankTotal = data.total || 0;
          const instances = data.instances || [];
          if (!instances.length) {
            bankEl.innerHTML = '<div class="lesson-modal-placeholder">Группы не найдены</div>';
            return;
          }
          bankEl.innerHTML = '';
          instances.forEach(inst => {
            const card = document.createElement('div');
            card.className = 'lesson-bank-card';
            card.dataset.groupId = String(inst.group_id || '');

            const topRow = document.createElement('div');
            topRow.className = 'lesson-bank-card-header';

            const titleCol = document.createElement('div');
            titleCol.style.minWidth = '0';
            titleCol.style.flex = '1';
            const titleEl = document.createElement('div');
            titleEl.className = 'lesson-bank-group-title';
            titleEl.textContent = `Группа заданий · вариант #${inst.group_id}`;
            const subEl = document.createElement('div');
            subEl.className = 'lesson-bank-group-subtitle';
            const nums = (inst.tasks || []).map(x => x.task_number).filter(Boolean).join(', ');
            subEl.textContent = nums ? `Номера: ${nums}` : '';
            titleCol.appendChild(titleEl);
            if (nums) titleCol.appendChild(subEl);

            const addBtn = document.createElement('button');
            addBtn.className = 'lesson-modal-add-group-btn lesson-ui-btn lesson-ui-btn--primary';
            addBtn.dataset.gid = String(inst.group_id || '');
            addBtn.textContent = 'Добавить группу';
            addBtn.onclick = () => addExtraGroup(inst, addBtn, card);

            topRow.appendChild(titleCol);
            topRow.appendChild(addBtn);
            card.appendChild(topRow);

            const tasksWrap = document.createElement('div');
            tasksWrap.className = 'lesson-bank-group-items';
            (inst.tasks || []).forEach((sub, idx) => {
              const row = document.createElement('div');
              row.className = 'lesson-bank-group-item';
              const meta = document.createElement('div');
              meta.className = 'lesson-bank-meta';
              meta.style.marginBottom = '8px';
              const nb = document.createElement('span');
              nb.className = 'lesson-bank-badge lesson-bank-badge--num';
              nb.textContent = `Задание ${sub.task_number}`;
              meta.appendChild(nb);
              if (sub.part_title) {
                const pb = document.createElement('span');
                const isPt2 = (sub.max_score || 1) > 1 || (sub.part_id != null && sub.part_id !== 1);
                pb.className = `lesson-bank-badge ${isPt2 ? 'lesson-bank-badge--part2' : 'lesson-bank-badge--part1'}`;
                pb.textContent = sub.part_title + (sub.max_score > 1 ? ` · ${sub.max_score} б.` : '');
                meta.appendChild(pb);
              }
              row.appendChild(meta);
              const textEl = document.createElement('div');
              textEl.className = 'lesson-bank-task-text';
              textEl.style.maxHeight = '200px';
              textEl.style.overflow = 'auto';
              textEl.innerHTML = sub.text || '';
              row.appendChild(textEl);
              tasksWrap.appendChild(row);
            });
            card.appendChild(tasksWrap);
            bankEl.appendChild(card);
          });

          if (window.MathJax?.typesetPromise) {
            window.MathJax.typesetPromise([bankEl]).catch(() => {});
          }

          const perPage = 10;
          const totalPages = Math.ceil(modalBankTotal / perPage);
          if (totalPages > 1) {
            const pag = document.createElement('div');
            pag.className = 'lesson-bank-pagination';
            for (let p = 1; p <= totalPages; p++) {
              const pb = document.createElement('button');
              pb.textContent = p;
              pb.className = `lesson-page-btn${p === page ? ' is-active' : ''}`;
              pb.onclick = () => loadGroupBank(item, p);
              pag.appendChild(pb);
            }
            bankEl.appendChild(pag);
          }
        } catch (_) {
          const bankEl2 = document.getElementById('lesson-task-bank');
          if (bankEl2) bankEl2.innerHTML = '<div class="lesson-modal-placeholder lesson-modal-placeholder--error">Ошибка загрузки групп</div>';
        }
      };

      const addExtraGroup = (inst, btnEl, cardEl) => {
        let added = 0;
        (inst.tasks || []).forEach(t => {
          if (!t.id || extraTasks.find(et => et.id === t.id)) return;
          const maxScore = t.max_score || 1;
          const isPart2 = maxScore > 1 || (t.part_id != null && t.part_id !== 1);
          const task = {
            id: t.id,
            taskNum: t.task_number,
            taskTitle: t.task_title || '',
            text: t.text || '',
            answer: t.answer || '',
            maxScore,
            isPart2,
            taskListId: t.task_list_id || null,
          };
          extraTasks.push(task);
          sendWs({ type: 'lesson_extra_task', task });
          added++;
        });
        const doc = getDoc();
        if (doc && added) renderExtraTasks(doc);
        const allIn = (inst.tasks || []).every(t => !t.id || extraTasks.find(et => et.id === t.id));
        if (btnEl && cardEl) {
          if (allIn) {
            btnEl.textContent = '✓ Группа добавлена';
            btnEl.disabled = true;
            btnEl.style.background = '#15803d';
            cardEl.style.opacity = '0.92';
          } else if (added > 0) {
            btnEl.textContent = `Добавлено ${added} из ${(inst.tasks || []).length}`;
          }
        }
      };

      const addExtraTask = (t) => {
        if (extraTasks.find(et => et.id === t.id)) return;
        const maxScore = t.max_score || 1;
        const isPart2 = maxScore > 1 || (t.part_id != null && t.part_id !== 1);
        const task = { id: t.id, taskNum: t.task_number, taskTitle: t.task_title || '', text: t.text || '', answer: t.answer || '', maxScore, isPart2, taskListId: t.task_list_id || null };
        extraTasks.push(task);
        const doc = getDoc();
        if (doc) renderExtraTasks(doc);
        sendWs({ type: 'lesson_extra_task', task });
        const bankEl = document.getElementById('lesson-task-bank');
        if (bankEl) {
          const added = bankEl.querySelector(`[data-tid="${t.id}"]`);
          if (added) { added.textContent = '✓ Добавлено'; added.disabled = true; added.style.background = '#15803d'; }
        }
      };

      const closeAddTaskModal = () => {
        if (addTaskModalEl) addTaskModalEl.style.display = 'none';
        document.body.style.overflow = '';
      };

      if (addTaskBtnEl) addTaskBtnEl.onclick = openAddTaskModal;
      document.getElementById('lesson-add-task-modal-close')?.addEventListener('click', closeAddTaskModal);
      addTaskModalEl?.addEventListener('click', (e) => { if (e.target === addTaskModalEl) closeAddTaskModal(); });

      // —— Завершить урок: итоги, комментарии, PDF / CSV, закрытие сессии ——
      const finishModalEl = document.getElementById('lesson-finish-modal');
      const finishModalBody = document.getElementById('lesson-finish-modal-body');
      const studentUiEl = document.getElementById('lesson-student-ui');
      const studentResultsBtn = document.getElementById('lesson-student-results-top-btn');
      const studentResultsModalEl = document.getElementById('lesson-student-results-modal');
      const studentResultsModalBody = document.getElementById('lesson-student-results-body');
      const statusToastEl = document.getElementById('lesson-status-toast');
      const statusToastTextEl = document.getElementById('lesson-status-toast-text');

      const showLessonStatusToast = (text) => {
        if (!statusToastEl || !statusToastTextEl) return;
        statusToastTextEl.textContent = String(text || '').trim() || 'Статус обновлён';
        statusToastEl.classList.add('show');
      };
      const hideLessonStatusToast = () => {
        statusToastEl?.classList.remove('show');
      };
      document.getElementById('lesson-status-toast-close')?.addEventListener('click', hideLessonStatusToast);

      const resolveTaskLabel = (taskNumberRaw) => {
        const raw = String(taskNumberRaw || '').trim();
        if (!raw) return '—';
        if (raw.startsWith('t') && /^\d+$/.test(raw.slice(1))) {
          const tid = raw.slice(1);
          const doc = getDoc();
          const numEl = doc?.querySelector(`.task[data-task-id="${tid}"] .task-number`);
          const n = normalizeTaskNumber(numEl ? numEl.textContent : "");
          return n ? `Задание ${n}` : `Задание #${tid}`;
        }
        const n = normalizeTaskNumber(raw);
        return n ? `Задание ${n}` : `Задание ${safeHtml(raw)}`;
      };

      const openStudentResultsModal = () => {
        if (!studentResultsModalEl) return;
        studentResultsModalEl.style.display = 'block';
        studentResultsModalEl.style.alignItems = 'flex-start';
        studentResultsModalEl.style.justifyContent = 'center';
        document.body.style.overflow = 'hidden';
      };
      const closeStudentResultsModal = () => {
        if (!studentResultsModalEl) return;
        studentResultsModalEl.style.display = 'none';
        document.body.style.overflow = '';
      };

      const hideStudentResultsButton = () => {
        if (!studentResultsBtn) return;
        studentResultsBtn.style.display = 'none';
      };

      const loadStudentResultsModal = async () => {
        if (!studentResultsModalBody) return;
        if (!lessonPageToken) {
          studentResultsModalBody.innerHTML = '<p class="lesson-modal-placeholder lesson-modal-placeholder--error">Токен урока не найден.</p>';
          return;
        }
        studentResultsModalBody.innerHTML = '<p class="lesson-modal-placeholder">Загрузка…</p>';
        try {
          const base = new URLSearchParams();
          base.set('token', lessonPageToken);
          base.set('role', 'student');
          if (variantId) base.set('variant_id', String(variantId));

          const [resSummary, resAnswers] = await Promise.all([
            fetch(`/api/lesson/results/?${base.toString()}`, { credentials: 'include' }),
            fetch(`/api/lesson/task-answers/?${base.toString()}`, { credentials: 'include' }),
          ]);
          const summaryData = await resSummary.json().catch(() => ({}));
          const answersData = await resAnswers.json().catch(() => ({}));
          if (!resSummary.ok || !summaryData.ok) {
            throw new Error(summaryData.error || 'Не удалось загрузить сводные результаты');
          }
          if (!resAnswers.ok || !answersData.ok) {
            throw new Error(answersData.error || 'Не удалось загрузить ответы');
          }

          const summary = Array.isArray(summaryData.results) ? summaryData.results[0] : null;
          const answers = Array.isArray(answersData.answers) ? answersData.answers : [];

          let html = '';
          if (summary) {
            html += `
              <div class="lesson-student-results-summary">
                <div><b>Всего задач:</b> ${summary.total_tasks ?? 0}</div>
                <div><b>Верно:</b> ${summary.correct_count ?? 0} · <b>Неверно:</b> ${summary.wrong_count ?? 0} · <b>Пусто:</b> ${summary.empty_count ?? 0}</div>
                ${summary.teacher_comment ? `<div style="margin-top:6px;"><b>Комментарий учителя:</b> ${safeHtml(summary.teacher_comment)}</div>` : ''}
              </div>
            `;
          }
          if (answers.length) {
            html += `
              <table class="lesson-student-results-table">
                <thead>
                  <tr>
                    <th>Задание</th>
                    <th>Ваш ответ</th>
                    <th>Статус</th>
                  </tr>
                </thead>
                <tbody>
                  ${answers.map((a) => {
                    const status = a.is_correct
                      ? '<span class="lesson-student-results-badge lesson-student-results-badge--ok">Правильно</span>'
                      : '<span class="lesson-student-results-badge lesson-student-results-badge--bad">Неправильно</span>';
                    return `<tr>
                      <td>${resolveTaskLabel(a.task_number)}</td>
                      <td>${safeHtml(a.answer || '—')}</td>
                      <td>${status}</td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            `;
          } else if (!summary) {
            html = '<p class="lesson-modal-placeholder">Пока нет результатов.</p>';
          }
          studentResultsModalBody.innerHTML = html;
        } catch (e) {
          studentResultsModalBody.innerHTML = `<p class="lesson-modal-placeholder lesson-modal-placeholder--error">${safeHtml(e?.message || 'Ошибка сети')}</p>`;
        }
      };

      const openFinishModal = () => {
        if (!finishModalEl || !isTeacher) return;
        finishModalEl.style.display = 'flex';
        finishModalEl.style.alignItems = 'flex-start';
        finishModalEl.style.justifyContent = 'center';
        document.body.style.overflow = 'hidden';
        loadLessonResultsModal();
      };
      const closeFinishModal = () => {
        if (!finishModalEl) return;
        finishModalEl.style.display = 'none';
        document.body.style.overflow = '';
      };

      const loadLessonResultsModal = async () => {
        if (!finishModalBody) return;
        finishModalBody.innerHTML = '<p class="lesson-modal-placeholder">Загрузка…</p>';
        const params = new URLSearchParams();
        if (lessonPageToken) {
          params.set('token', lessonPageToken);
          params.set('role', 'teacher');
        } else {
          params.set('room_id', roomId);
        }
        if (variantId) params.set('variant_id', String(variantId));
        try {
          const res = await fetch(`/api/lesson/results/?${params.toString()}`, { credentials: 'include' });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            finishModalBody.innerHTML = `<p class="lesson-modal-placeholder lesson-modal-placeholder--error">${safeHtml(data.error || 'Не удалось загрузить результаты')}</p>`;
            return;
          }
          const rows = data.results || [];
          if (!rows.length) {
            finishModalBody.innerHTML = '<p class="lesson-modal-placeholder">Пока нет записей в базе результатов. Они появятся после ответов учеников и синхронизации с сервером.</p>';
            return;
          }
          finishModalBody.innerHTML = rows.map((r) => {
            const st = String(r.student || '').trim();
            return (
              `<div class="lesson-result-card" data-student="${escAttr(st)}">` +
                `<div class="lesson-result-student">${safeHtml(st)}</div>` +
                `<div class="lesson-result-meta">` +
                `Всего задач: <b>${r.total_tasks ?? '—'}</b> · верно: <b style="color:#15803d;">${r.correct_count ?? 0}</b> · неверно: <b style="color:#b91c1c;">${r.wrong_count ?? 0}</b> · пусто: <b>${r.empty_count ?? 0}</b>` +
                `</div>` +
                `<label class="lesson-result-label">Комментарий учителя</label>` +
                `<textarea class="lesson-teacher-comment-ta lesson-result-comment" rows="3"></textarea>` +
                `<button type="button" class="lesson-save-comment-btn">Сохранить комментарий</button>` +
              `</div>`
            );
          }).join('');
          const cards = finishModalBody.querySelectorAll('.lesson-result-card');
          rows.forEach((r, i) => {
            const ta = cards[i]?.querySelector('.lesson-teacher-comment-ta');
            if (ta) ta.value = String(r.teacher_comment || '');
          });
          finishModalBody.querySelectorAll('.lesson-result-card').forEach((card) => {
            const st = card.getAttribute('data-student') || '';
            const btn = card.querySelector('.lesson-save-comment-btn');
            const ta = card.querySelector('.lesson-teacher-comment-ta');
            if (btn && ta) {
              btn.addEventListener('click', async () => {
                btn.disabled = true;
                const prev = btn.textContent;
                btn.textContent = '…';
                try {
                  const res = await fetch('/api/lesson/student-comment/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                      lesson_token: lessonPageToken,
                      token: lessonPageToken,
                      room_id: roomId,
                      teacher: me,
                      student: st,
                      teacher_comment: ta.value,
                      variant_id: variantId ? Number(variantId) : 0,
                    }),
                  });
                  const j = await res.json();
                  if (!res.ok || !j.ok) throw new Error(j.error || 'Ошибка');
                  btn.textContent = 'Сохранено';
                  setTimeout(() => { btn.textContent = prev; btn.disabled = false; }, 1600);
                } catch (_) {
                  btn.textContent = 'Ошибка';
                  btn.disabled = false;
                  setTimeout(() => { btn.textContent = prev; }, 2000);
                }
              });
            }
          });
        } catch (_) {
          finishModalBody.innerHTML = '<p class="lesson-modal-placeholder lesson-modal-placeholder--error">Ошибка сети</p>';
        }
      };

      const downloadLessonPdf = (preOpenedWindow = null) => {
        const pdfUrl = buildLessonReportDownloadUrl('pdf');
        if (preOpenedWindow && !preOpenedWindow.closed) {
          preOpenedWindow.location.href = pdfUrl;
          return;
        }
        window.open(pdfUrl, '_blank', 'noopener');
      };

      const closeLessonSession = async () => {
        if (!lessonPageToken) {
          alert('Нужен токен урока для закрытия комнаты.');
          return;
        }
        if (!confirm('Закрыть урок для всех? Откроется PDF-отчёт, затем переход в личный кабинет. Повторный вход по той же ссылке будет недоступен.')) return;
        const pendingPdfWindow = window.open('', '_blank');
        if (pendingPdfWindow) pendingPdfWindow.opener = null;
        try {
          const res = await fetch('/api/lesson/finalize/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ token: lessonPageToken, role: 'teacher' }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            if (pendingPdfWindow && !pendingPdfWindow.closed) pendingPdfWindow.close();
            alert(data.error || 'Не удалось закрыть урок');
            return;
          }
          closeFinishModal();
          showLessonStatusToast('Проверено. Результаты сохранены.');
          openFinishModal();
          try {
            downloadLessonPdf(pendingPdfWindow);
          } catch (_) {}
          redirectToLkAfterLessonEnd();
        } catch (_) {
          if (pendingPdfWindow && !pendingPdfWindow.closed) pendingPdfWindow.close();
          alert('Ошибка сети');
        }
      };

      if (!isTeacher && studentUiEl) {
        studentUiEl.style.display = 'block';
      }
      document.getElementById('lesson-finish-modal-close')?.addEventListener('click', closeFinishModal);
      finishModalEl?.addEventListener('click', (e) => { if (e.target === finishModalEl) closeFinishModal(); });
      document.getElementById('lesson-finish-download-pdf')?.addEventListener('click', downloadLessonPdf);
      document.getElementById('lesson-finish-close-session')?.addEventListener('click', closeLessonSession);
      studentResultsBtn?.addEventListener('click', async () => {
        hideStudentResultsButton();
        openStudentResultsModal();
        await loadStudentResultsModal();
      });
      document.getElementById('lesson-student-results-modal-close')?.addEventListener('click', closeStudentResultsModal);
      studentResultsModalEl?.addEventListener('click', (e) => { if (e.target === studentResultsModalEl) closeStudentResultsModal(); });

      setupTeacher();
      setupCursorBroadcast();
      setupStudent();
      openVariantIfReady(src);
    })();
  </script>
</body>
</html>
