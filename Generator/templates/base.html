{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{% block title %} {% endblock %}</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=1" sizes="64x64" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=1" />
    <link rel="apple-touch-icon" href="/favicon.png?v=1" />
    <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/fonts/django.css">

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    
    <style>
        body {
            background-image: url("{% static 'img/bg.png' %}");
            background-repeat: repeat;
            background-size: auto;
            background-attachment: fixed;
        }
        .header-brand-logo {
            height: 72px;
            width: auto;
            display: block;
            object-fit: contain;
        }
        .logo a {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
    </style>
    
    {% block links %} {% endblock %}
</head>

<body>

    <header>
        <div class="container">
            <div class="header-wrapper">
                <div class="logo">
                    <a href="/">
                        <img src="/favicon.png?v=1" alt="Цифровой поток" class="header-brand-logo" width="72" height="72" decoding="async" />
                        <span class="logo-text">Цифровой поток</span>
                    </a>
                </div>
                
            </div>
        </div>
    </header>

    <aside>
        <!-- боковое меню -->
    </aside>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        © 2026
    </footer>
    
    <script src="/vendor/bootstrap/bootstrap.min.js"></script>
    <script src="/vendor/mathjax/itflux-config.js"></script>
    <script id="MathJax-script" src="/vendor/mathjax/tex-chtml.js"></script>

</body>

</html>
