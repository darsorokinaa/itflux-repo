<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кнопка — превью</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #F4F6FF;
    background-image:
      linear-gradient(rgba(43,80,245,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(43,80,245,.07) 1px, transparent 1px);
    background-size: 32px 32px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 48px 32px;
  }

  .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #8892BB;
    margin-bottom: 12px;
    text-align: center;
  }

  .group { text-align: center; }

  /* ── АКТИВНАЯ кнопка ── */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 240px;
    height: 52px;
    border-radius: 14px;
    padding: 0 28px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: -0.01em;
    border: none;
    cursor: pointer;
    background: #2B50F5;
    color: #FFFFFF;
    box-shadow: 0 8px 24px rgba(43, 80, 245, 0.28);
    transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  }

  .btn-primary:hover {
    background: #1A2FB0;
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(43, 80, 245, 0.36);
  }

  .btn-primary:active {
    transform: scale(0.97);
  }

  .btn-primary svg {
    flex-shrink: 0;
  }

  /* ── НЕАКТИВНАЯ кнопка ── */
  .btn-disabled {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 240px;
    height: 52px;
    border-radius: 14px;
    padding: 0 28px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: -0.01em;
    border: none;
    cursor: not-allowed;
    background: #DDE3FF;
    color: #8892BB;
    box-shadow: none;
  }

  /* Карточка-контекст — как на реальной странице */
  .context-card {
    background: #fff;
    border: 1px solid #DDE3FF;
    border-radius: 20px;
    padding: 32px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 2px 12px rgba(43,80,245,.07);
    max-width: 480px;
    width: 100%;
  }

  .context-hint {
    font-size: 13px;
    color: #8892BB;
    font-weight: 500;
    text-align: center;
  }

  .step-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: #EBF0FF;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    color: #2B50F5;
  }

  .divider { width: 100%; height: 1px; background: #DDE3FF; }
</style>
</head>
<body>

<div class="group">
  <p class="label">Активная — предмет выбран</p>
  <div class="context-card">
    <div class="step-badge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2B50F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      Информатика · ОГЭ
    </div>
    <p class="context-hint">Готово! Открываем задания по выбранной теме</p>
    <button class="btn-primary">
      Перейти к заданиям
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </button>
  </div>
</div>

<div class="group">
  <p class="label">Неактивная — предмет не выбран</p>
  <div class="context-card">
    <p class="context-hint">Выберите предмет на шаге 2 чтобы продолжить</p>
    <button class="btn-disabled" disabled>
      Перейти к заданиям
    </button>
  </div>
</div>

</body>
</html>
