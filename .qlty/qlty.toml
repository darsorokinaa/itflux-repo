config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

# Bandit blocks the gate (B105/B106 and the rest of the default set).
# Ruff runs as a linter. Its formatter is off: it would rewrite whole files
# that were never formatted with ruff.
# ESLint's bundled config fails here (missing package "globals"), so the
# plugin is disabled instead of failing the whole run.
[[plugin]]
name = "ruff"
mode = "comment"
drivers = ["lint"]

[[plugin]]
name = "bandit"
mode = "block"

[[plugin]]
name = "eslint"
package_file = "frontend/package.json"
package_filters = ["eslint", "jest"]
mode = "disabled"
