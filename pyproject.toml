requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "channels>=4.3.2",
    "django>=5.2.11",
    "djangorestframework>=3.16.0",
    "django-ckeditor>=6.7.3",
    "django-ckeditor-5>=0.2.19",
    "django-cors-headers>=4.9.0",
    "gunicorn>=25.1.0",
    "psycopg2-binary>=2.9.11",
    "weasyprint>=68.1",
    "whitenoise>=6.11.0",
]
