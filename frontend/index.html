  <meta charset="UTF-8" />
  <script>
    (function () {
      if (window.__itfluxBootMark) return;
      var labels = {
        html: "HTML загружен",
        main_js_start: "загрузка основного JS началась",
        main_js_done: "загрузка основного JS завершилась",
        main_jsx: "main.jsx начал выполнение",
        react_root: "React root создан",
        first_ui: "первый интерфейс отображён",
        auth_start: "запущена авторизация",
        auth_ok: "авторизация завершилась",
        auth_error: "авторизация завершилась ошибкой",
        api_ok: "первый API-запрос завершился",
        api_error: "первый API-запрос завершился ошибкой",
        sw_ok: "Service Worker зарегистрирован",
        sw_error: "Service Worker вернул ошибку",
        watchdog_hang: "watchdog обнаружил возможное зависание"
      };
      var seen = {};
      window.__ITFLUX_BOOT_SEEN = seen;
      window.__ITFLUX_BOOT_LOG = [];
      window.__itfluxBootMark = function (stage, status) {
        try {
          var key = String(stage || "").slice(0, 40);
          if (!key || seen[key]) return;
          seen[key] = 1;
          var now = 0;
          if (window.performance && typeof performance.now === "function") now = Math.round(performance.now());
          var entry = { t: now, stage: key };
          var note = status ? String(status).slice(0, 24) : "";
          if (note) entry.status = note;
          window.__ITFLUX_BOOT_LOG.push(entry);
          var label = labels[key] || key;
          var suffix = note === "error" ? " ошибка" : "";
          console.info("[ITFLUX_BOOT] +" + now + "ms " + key + " — " + label + suffix);
        } catch (err) { /* диагностика не блокирует запуск */ }
      };
      window.__itfluxBootMark("html");
    })();
  </script>

  <script id="itflux-cdn-hint-script">
    /* Подсказка про запасной адрес, если приложение не отрисовалось за ~10 с. Без внешних запросов. */
    (function () {
      try {
        var CDN = "cdn.itflux-academy.ru";
        var host = String(location.hostname || "").toLowerCase();
        if (host !== "itflux-academy.ru" && host !== "www.itflux-academy.ru") return;
        try { if (sessionStorage.getItem("itfluxCdnHintDismissed")) return; } catch (e) { /* ignore */ }
        var ms = Number(window.__ITFLUX_CDN_HINT_MS) || 10000;
        setTimeout(function () {
          if (window.__ITFLUX_BOOTED || document.getElementById("itflux-cdn-hint") || !document.body) return;
          var box = document.createElement("div");
          box.id = "itflux-cdn-hint";
          box.setAttribute("role", "status");
          var text = document.createElement("span");
          text.appendChild(document.createTextNode("Сайт грузится медленно? "));
          var a = document.createElement("a");
          a.href = "https://" + CDN + location.pathname + location.search + location.hash;
          a.textContent = "Откройте через запасной адрес";
          text.appendChild(a);
          var close = document.createElement("button");
          close.type = "button";
          close.setAttribute("aria-label", "Закрыть");
          close.textContent = "\u00d7";
          close.onclick = function () {
            try { sessionStorage.setItem("itfluxCdnHintDismissed", "1"); } catch (e) { /* ignore */ }
            if (box.parentNode) box.parentNode.removeChild(box);
          };
          box.appendChild(text);
          box.appendChild(close);
          document.body.appendChild(box);
        }, ms);
      } catch (err) { /* подсказка не блокирует запуск */ }
    })();
  </script>
