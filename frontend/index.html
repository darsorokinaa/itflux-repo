  <script id="itflux-cdn-hint-script">
    /* r86: запасной адрес cdn.itflux-academy.ru (TLS-релей). Без внешних запросов.
       Основной хост: флаг в localStorage (7 дней) — сразу на cdn; если приложение не загрузилось за 10 с —
       ставим флаг, показываем подсказку и переходим на cdn. ?itflux_nocdn=1 — снять флаг и остаться.
       cdn: обратно автоматически НЕ уводим (без петли); через 15 с без загрузки — подсказка со ссылкой. */
    (function () {
      try {
        var CDN = "cdn.itflux-academy.ru", MAIN = "itflux-academy.ru", KEY = "itfluxPreferCdn";
        var TTL = 7 * 24 * 3600 * 1000;
        var host = String(location.hostname || "").toLowerCase();
        var onMain = host === MAIN || host === "www." + MAIN;
        var onCdn = host === CDN;
        if (!onMain && !onCdn) return;
        var tail = location.pathname + location.search + location.hash;
        var cdnUrl = "https://" + CDN + tail;
        var ls = null;
        try { ls = window.localStorage; } catch (e) { ls = null; }
        function get() { try { return ls ? Number(ls.getItem(KEY)) || 0 : 0; } catch (e) { return 0; } }
        function set(v) { try { if (!ls) return false; if (v) ls.setItem(KEY, String(v)); else ls.removeItem(KEY); return true; } catch (e) { return false; } }
        function go(url) { try { (window.__ITFLUX_NAVIGATE || function (u) { location.replace(u); })(url); } catch (e) { /* ignore */ } }
        if (onMain) {
          if (/[?&]itflux_nocdn=1(&|$)/.test(location.search)) { set(0); window.__ITFLUX_NO_CDN = 1; }
          else {
            var ts = get(), now = Date.now();
            if (ts && now - ts >= 0 && now - ts < TTL) { window.__ITFLUX_CDN_REDIRECTING = 1; go(cdnUrl); return; }
            if (ts) set(0);
          }
        }
        var dismissKey = "itfluxCdnHintDismissed";
        function dismissed() { try { return !!sessionStorage.getItem(dismissKey); } catch (e) { return false; } }
        function banner(label, href) {
          if (document.getElementById("itflux-cdn-hint") || !document.body) return;
          var box = document.createElement("div");
          box.id = "itflux-cdn-hint";
          box.setAttribute("role", "status");
          var text = document.createElement("span");
          text.appendChild(document.createTextNode("Сайт грузится медленно? "));
          var a = document.createElement("a");
          a.href = href;
          a.textContent = label;
          text.appendChild(a);
          var close = document.createElement("button");
          close.type = "button";
          close.setAttribute("aria-label", "Закрыть");
          close.textContent = "\u00d7";
          close.onclick = function () {
            try { sessionStorage.setItem(dismissKey, "1"); } catch (e) { /* ignore */ }
            if (box.parentNode) box.parentNode.removeChild(box);
          };
          box.appendChild(text);
          box.appendChild(close);
          document.body.appendChild(box);
        }
        var ms = Number(window.__ITFLUX_CDN_HINT_MS) || (onCdn ? 15000 : 10000);
        setTimeout(function () {
          if (window.__ITFLUX_BOOTED) return;
          if (onMain) {
            if (!dismissed()) banner("Откройте через запасной адрес", cdnUrl);
            if (!window.__ITFLUX_NO_CDN && set(Date.now())) { try { if (window.__itfluxLoadTiming) window.__itfluxLoadTiming("auto_switch"); } catch (e) { /* ignore */ } go(cdnUrl); }
          } else if (!dismissed()) {
            var sep = location.search ? "&" : "?";
            banner("Попробуйте основной адрес", "https://" + MAIN + location.pathname + location.search + sep + "itflux_nocdn=1" + location.hash);
          }
        }, ms);
      } catch (err) { /* подсказка не блокирует запуск */ }
    })();
  </script>
  <script>
    (function () {
      if (window.__itfluxBootMark) return;
      var labels = {
        html: "HTML загружен",
        main_js_start: "загрузка основного JS началась",
        main_js_done: "загрузка основного JS завершилась",
        main_jsx: "main.jsx начал выполнение",
        react_root: "React root создан",
        first_ui: "первый интерфейс отображён",
        auth_start: "запущена авторизация",
        auth_ok: "авторизация завершилась",
        auth_error: "авторизация завершилась ошибкой",
        api_ok: "первый API-запрос завершился",
        api_error: "первый API-запрос завершился ошибкой",
        sw_ok: "Service Worker зарегистрирован",
        sw_error: "Service Worker вернул ошибку",
        watchdog_hang: "watchdog обнаружил возможное зависание"
      };
      var seen = {};
      window.__ITFLUX_BOOT_SEEN = seen;
      window.__ITFLUX_BOOT_LOG = [];
      window.__itfluxBootMark = function (stage, status) {
        try {
          var key = String(stage || "").slice(0, 40);
          if (!key || seen[key]) return;
          seen[key] = 1;
          var now = 0;
          if (window.performance && typeof performance.now === "function") now = Math.round(performance.now());
          var entry = { t: now, stage: key };
          var note = status ? String(status).slice(0, 24) : "";
          if (note) entry.status = note;
          window.__ITFLUX_BOOT_LOG.push(entry);
          var label = labels[key] || key;
          var suffix = note === "error" ? " ошибка" : "";
          console.info("[ITFLUX_BOOT] +" + now + "ms " + key + " — " + label + suffix);
        } catch (err) { /* диагностика не блокирует запуск */ }
      };
      window.__itfluxBootMark("html");
    })();
  </script>

  <script id="itflux-load-timing-script">
    /* r105: анонимный замер загрузки (cdn vs direct). Один sendBeacon на загрузку страницы → /api/load-timing/.
       Только тайминги навигации, момент готовности приложения и тип события; хост/UA сервер берёт из запроса. */
    (function () {
      try {
        var host = String(location.hostname || "").toLowerCase();
        if (!/(^|\.)itflux-academy\.ru$/.test(host) || window.__ITFLUX_CDN_REDIRECTING) return;
        if (!navigator.sendBeacon || !window.performance) return;
        var sent = false, readyAt = null, FAIL_MS = Number(window.__ITFLUX_LT_FAIL_MS) || 30000, started = Date.now();
        function nav() {
          try { var e = performance.getEntriesByType("navigation")[0]; if (e) return e; } catch (err) { /* ignore */ }
          return null;
        }
        function ms(v) { return typeof v === "number" && v > 0 ? Math.round(v) : null; }
        function send(ev) {
          if (sent) return;
          sent = true;
          var e = nav(), t = performance.timing || {};
          var base = t.navigationStart || 0;
          var p = {
            ev: ev,
            ttfb: e ? ms(e.responseStart) : ms(t.responseStart - base),
            dcl: e ? ms(e.domContentLoadedEventEnd) : ms(t.domContentLoadedEventEnd - base),
            load: e ? ms(e.loadEventEnd) : ms(t.loadEventEnd - base),
            ready: readyAt,
            nav: e && e.type ? String(e.type) : "",
            sw: navigator.serviceWorker && navigator.serviceWorker.controller ? 1 : 0
          };
          try { navigator.sendBeacon("/api/load-timing/", new Blob([JSON.stringify(p)], { type: "text/plain" })); } catch (err) { /* ignore */ }
        }
        window.__itfluxLoadTiming = send;
        var iv = setInterval(function () {
          if (sent) { clearInterval(iv); return; }
          if (readyAt === null && window.__ITFLUX_BOOTED) readyAt = Math.round(performance.now());
          if (readyAt !== null && document.readyState === "complete") { clearInterval(iv); setTimeout(function () { send("ok"); }, 0); return; }
          if (Date.now() - started > FAIL_MS) { clearInterval(iv); send(readyAt !== null ? "ok" : "boot_fail"); }
        }, 500);
        window.addEventListener("pagehide", function () { if (!sent) send(readyAt !== null ? "ok" : "hidden"); });
      } catch (err) { /* замер не блокирует запуск */ }
    })();
  </script>
